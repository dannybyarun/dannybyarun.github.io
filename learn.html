    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="qcard">
      <div class="qmeta">
        <span class="chip">${SUBJ[q.s]}</span>
        <span class="chip">${q.y}</span>
        ${q.sec ? `<span class="chip">${q.sec}</span>` : ""}
        <span class="mchip">${q.marks || 5} marks${q.guess ? " · est." : ""}</span>
        <span class="chip">${drill.i + 1} / ${drill.queue.length}</span>
        <button class="logicbtn" data-playlogic="${q.id}">▶ Logic · Video</button>
      </div>
      <div class="qwrap"><p class="qtext" tabindex="0" style="margin:0">${esc(q.q)}</p>${hintPop(q.id)}</div>
      <p class="hintline">Answer it out loud or on paper first. Target: ${(q.marks || 5) >= 10 ? "12–14 minutes, one page" : "5–6 minutes, half a page"}.</p>
      <div class="rate">
        <button data-k="again">Again<b>blank</b></button>
        <button data-k="hard">Hard<b>half of it</b></button>
        <button data-k="good">Good<b>most of it</b></button>
        <button data-k="easy">Easy<b>full answer</b></button>
      </div>
      <div id="drillKit"></div>
      <div style="margin-top:10px"><span class="hintbtn" id="revealQ">Show answer kit →</span></div>
    </div>`;
  area.querySelectorAll(".rate button").forEach((b) => b.addEventListener("click", () => rate(q, b.dataset.k)));
  document.getElementById("revealQ").addEventListener("click", (e) => {
    const a = ansOf(q.id);
    document.getElementById("drillKit").innerHTML = kitHTML(a, "Answer kit");
    wireKit(document.getElementById("drillKit"));
    e.target.textContent = "Hide answer kit";
    e.target.style.display = "none";
  });
}

function rate(q, k) {
  const now = Date.now();
  const r = SRS.reviews[q.id] || { ease: 2.5, interval: 0, reps: 0, seen: 0 };
  r.seen++;
  r.last = now;
  if (k === "again") { r.interval = 0; r.ease = Math.max(1.3, r.ease - 0.2); r.due = now + 10 * 60000; }
  else if (k === "hard") { r.interval = Math.max(1, r.interval * 1.2); r.ease = Math.max(1.3, r.ease - 0.15); r.due = now + r.interval * DAY; }
  else if (k === "good") { r.interval = r.interval ? r.interval * r.ease : 1; r.due = now + r.interval * DAY; }
  else { r.interval = r.interval ? r.interval * r.ease * 1.35 : 3; r.ease = Math.min(2.8, r.ease + 0.1); r.due = now + r.interval * DAY; }
  r.reps++;
  SRS.reviews[q.id] = r;
  const d = todayKey();
  SRS.days[d] = (SRS.days[d] || 0) + 1;
  saveSRS();
  drill.done++; drill.i++;
  if (drill.i >= drill.queue.length) endDrill();
  else if (k === "again") { drill.queue.push(q); showQuestion(); }
  else showQuestion();
}

function endDrill() {
  const area = document.getElementById("drillArea");
  const total = window.QBANK.filter((q) => q.s === drill.subj).length;
  const seen = window.QBANK.filter((q) => q.s === drill.subj && SRS.reviews[q.id]).length;
  area.innerHTML = `
    <div class="qcard" style="text-align:center">
      <p style="font-size:13px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin:0">Session complete</p>
      <h2 style="font-size:30px;margin:10px 0 4px">${drill.done} cards rated</h2>
      <p style="color:var(--mut);margin:0 0 18px">${seen} of ${total} ${SUBJ[drill.subj]} questions now in rotation.</p>
      <button class="act" onclick="go('drill')">Back to drill</button>
    </div>`;
}

/* =========================================================
   PROGRESS
   ========================================================= */
function progressView() {
  const due = window.QBANK.filter(isDue).length;
  const seen = Object.keys(SRS.reviews).length;
  const days = Object.keys(SRS.days).sort();
  let streak = 0;
  for (let i = 0; i < 400; i++) {
    const d = new Date(Date.now() - i * DAY).toISOString().slice(0, 10);
    if (SRS.days[d]) streak++;
    else if (i > 0) break;
  }
  const perSub = Object.entries(SUBJ).map(([k, v]) => {
    const all = window.QBANK.filter((q) => q.s === k);
    const s = all.filter((q) => SRS.reviews[q.id]).length;
    const dq = all.filter(isDue).length;
    return { k, v, all: all.length, seen: s, due: dq, pct: Math.round((s / all.length) * 100) };
  });

  view.innerHTML = `
    <h1>Progress</h1>
    <p class="sub">Counts what you have actually recalled, not what you have opened.</p>
    <div class="statgrid" style="margin-bottom:16px">
      <div class="stat"><span>In rotation</span><b>${seen}</b><div class="bar"><i style="width:${Math.round((seen / window.QBANK.length) * 100)}%"></i></div></div>
      <div class="stat"><span>Due now</span><b>${due}</b><div style="font-size:11.5px;color:var(--dim);margin-top:6px">from ${window.QBANK.length} questions</div></div>
      <div class="stat"><span>Day streak</span><b>${streak}</b><div style="font-size:11.5px;color:var(--dim);margin-top:6px">${days.length} active days</div></div>
    </div>
    <div class="panel">
      ${perSub.map((p) => `
        <div style="padding:11px 0;border-bottom:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;font-size:13.5px">
            <span>${p.v}</span><span style="color:var(--dim)">${p.seen}/${p.all} · ${p.due} due</span>
          </div>
          <div class="bar"><i style="width:${p.pct}%"></i></div>
        </div>`).join("")}
    </div>`;
}

/* =========================================================
   shared — answers, hints, kit
   ========================================================= */
const ANS = window.ANSWERS || {};
const TOP = window.TOPICS || {};
const LOGIC = window.LOGIC || {};
const REPS = window.REPEATS || [];
const VIDEOS = window.VIDEOS || {};
const REPEAT_IDS = new Set(REPS.flatMap((c) => c.ids || []));
const SUBORDER = ["se", "cdc", "egov", "ncc", "tw", "ecom"];

const ansOf = (id) => ANS[id] || null;

function bestAns(ids) {
  let best = null;
  for (const id of ids || []) {
    const a = ansOf(id);
    if (!a) continue;
    if (!best || (a.ans || "").length > (best.ans || "").length) best = { ...a, id };
  }
  return best;
}

function hintPop(id) {
  const a = ansOf(id);
  if (!a || !a.logic) return "";
  return `<div class="hintpop">
    <span class="hl">What they are testing</span><p>${esc(a.logic)}</p>
    <span class="hl">Learn it this way</span><p>${esc(a.how)}</p>
  </div>`;
}

function kitHTML(a, label) {
  if (!a) return `<div class="empty" style="padding:26px 0">No written answer for this one yet.</div>`;
  const pts = (a.skel || []).map((s, i) =>
    `<div class="pt hidden" data-i="${i}"><span class="tick">✓</span><span class="txt">${esc(s)}</span></div>`).join("");
  const n = (a.skel || []).length;
  return `<div class="kit" data-kit>
    <div class="kithead"><b>${label || "Answer kit"}</b><span class="hintbtn" data-next>Reveal next point →</span></div>
    <div class="kitbar"><i></i></div>
    <div class="kmeta"><span data-cov>0 / ${n} written</span><span data-pct>0%</span></div>
    ${pts}
    <div class="kithead" style="margin:12px 0 0">
      <span class="hintbtn" data-all>Show model answer</span>
      <span class="hintbtn" data-reset>Reset</span>
    </div>
    <div class="ansblock">${esc(a.ans)}</div>
  </div>`;
}

function wireKit(root) {
  root.querySelectorAll("[data-kit]").forEach((k) => {
    const bar = k.querySelector(".kitbar i");
    const ans = k.querySelector(".ansblock");
    const cov = k.querySelector("[data-cov]");
    const pct = k.querySelector("[data-pct]");
    const pts = [...k.querySelectorAll(".pt")];
    const upd = () => {
      const hit = pts.filter((p) => p.classList.contains("hit")).length;
      bar.style.width = (pts.length ? (hit / pts.length) * 100 : 0) + "%";
      if (cov) cov.textContent = `${hit} / ${pts.length} written`;
      if (pct) pct.textContent = Math.round((pts.length ? (hit / pts.length) * 100 : 0)) + "%";
    };
    pts.forEach((p) => p.addEventListener("click", (e) => {
      if (e.target.closest(".tick")) p.classList.toggle("hit");
      else p.classList.remove("hidden");
      upd();
    }));
    const next = k.querySelector("[data-next]");
    if (next) next.addEventListener("click", () => {
      const h = pts.find((p) => p.classList.contains("hidden"));
      if (h) h.classList.remove("hidden");
      else { ans.classList.add("show"); next.textContent = "All points shown"; }
      upd();
    });
    k.querySelector("[data-all]").addEventListener("click", () => {
      pts.forEach((p) => p.classList.remove("hidden"));
      ans.classList.toggle("show");
      upd();
    });
    k.querySelector("[data-reset]").addEventListener("click", () => {
      pts.forEach((p) => { p.classList.add("hidden"); p.classList.remove("hit"); });
      ans.classList.remove("show");
      next.textContent = "Reveal next point →";
      upd();
    });
    upd();
  });
}

/* ---- the logic reel: a five-step animation of the unit's causal chain ----
   Every question maps to a unit, and every unit's chain is already in
   data/logic.js. This plays it one step at a time, so the "video" is the
   argument itself rather than one file per question. */
let logicEl = null, logicTimer = null, logicAt = 0, logicSteps = [];

function logicModal() {
  if (logicEl) return logicEl;
  logicEl = document.createElement("div");
  logicEl.className = "logicmodal";
  logicEl.hidden = true;
  logicEl.innerHTML = `<div class="logicbox" role="dialog" aria-modal="true" aria-label="Logic reel and video">
    <div class="logichead">
      <div><div class="cap" data-lcap>Logic reel</div><h3 data-ltitle></h3></div>
      <button class="logicx" data-lclose aria-label="Close">×</button>
    </div>
    <div class="logicseg" role="tablist">
      <button role="tab" data-lseg="logic" aria-selected="true">Logic</button>
      <button role="tab" data-lseg="video" aria-selected="false">Video</button>
    </div>
    <p class="logicq" data-lq hidden></p>
    <div data-lpane="logic">
      <div class="logicstage" data-lstage></div>
      <div class="logicdots" data-ldots></div>
      <div class="logicctl">
        <button class="ghost" data-lprev>← Back</button>
        <button class="act" data-lplay>Pause</button>
        <button class="ghost" data-lnext>Next →</button>
        <span class="cap" data-lcount></span>
      </div>
      <p class="logicnote" data-lnote hidden></p>
    </div>
    <div data-lpane="video" hidden>
      <div class="vidlist" data-lvids></div>
      <p class="vidnote" data-lvnote></p>
    </div>
  </div>`;
  document.body.appendChild(logicEl);
  logicEl.addEventListener("click", (e) => { if (e.target === logicEl) closeLogic(); });
  logicEl.querySelector("[data-lclose]").addEventListener("click", closeLogic);
  logicEl.querySelector("[data-lvids]").addEventListener("click", (e) => {
    const b = e.target.closest("[data-vplay]");
    if (b) { playVideo(Number(b.dataset.vplay)); return; }
    if (e.target.closest("[data-vback]")) killVideo();
  });
  logicEl.querySelector("[data-lprev]").addEventListener("click", () => { stopLogic(); stepLogic(-1); });
  logicEl.querySelector("[data-lnext]").addEventListener("click", () => { stopLogic(); stepLogic(1); });
  logicEl.querySelector("[data-lplay]").addEventListener("click", () => {
    if (logicTimer) stopLogic(); else startLogic();
  });
  logicEl.querySelectorAll("[data-lseg]").forEach((b) =>
    b.addEventListener("click", () => showPane(b.dataset.lseg)));
  return logicEl;
}

function showPane(pane) {
  if (!logicEl) return;
  logicEl.querySelectorAll("[data-lseg]").forEach((b) =>
    b.setAttribute("aria-selected", String(b.dataset.lseg === pane)));
  logicEl.querySelectorAll("[data-lpane]").forEach((p) => {
    p.hidden = p.dataset.lpane !== pane;
  });
  if (pane !== "logic") stopLogic();
  if (pane !== "video") killVideo();
}

function stopLogic() {
  if (logicTimer) { clearInterval(logicTimer); logicTimer = null; }
  const b = logicEl && logicEl.querySelector("[data-lplay]");
  if (b) b.textContent = "Play";
}

function startLogic() {
  stopLogic();
  if (!logicSteps.length) return;
  if (logicAt >= logicSteps.length - 1) { logicAt = 0; paintLogic(); }
  const b = logicEl.querySelector("[data-lplay]");
  b.textContent = "Pause";
  logicTimer = setInterval(() => {
    if (logicAt >= logicSteps.length - 1) { stopLogic(); b.textContent = "Replay"; return; }
    logicAt++;
    paintLogic();
  }, 1600);
}

function stepLogic(d) {
  logicAt = Math.max(0, Math.min(logicSteps.length - 1, logicAt + d));
  paintLogic();
}

function paintLogic() {
  if (!logicEl || !logicSteps.length) return;
  const s = logicSteps[logicAt];
  logicEl.querySelector("[data-lstage]").innerHTML =
    `<div class="logicstep in"><span class="num">Step ${logicAt + 1} of ${logicSteps.length}</span>
      <h4>${esc(s.t)}</h4><p>${esc(s.d)}</p></div>`;
  logicEl.querySelectorAll("[data-ldots] i").forEach((d, i) => d.classList.toggle("on", i <= logicAt));
  logicEl.querySelector("[data-lcount]").textContent = `${logicAt + 1}/${logicSteps.length}`;
  const play = logicEl.querySelector("[data-lplay]");
  if (!logicTimer && logicAt === logicSteps.length - 1) play.textContent = "Replay";
}

function closeLogic() {
  stopLogic();
  killVideo();
  if (logicEl) logicEl.hidden = true;
  logicSteps = [];
  logicAt = 0;
}

function openLogic(qid, sub, n, pane) {
  const a = qid ? ansOf(qid) : null;
  sub = sub || (a ? String(qid).split("-")[0] : "se");
  n = n || (a && a.u ? Number(a.u) : 1);
  const lg = (LOGIC[sub] || []).find((u) => u.n === Number(n)) || null;
  const steps = (lg && lg.steps) || [];
  const vid = VIDEOS[`${sub}.${n}`] || null;
  if (!steps.length && !vid) return;
  const el = logicModal();
  logicSteps = steps;
  logicAt = 0;
  el.querySelector("[data-lcap]").textContent = `Logic reel · ${SUBJ[sub] || sub} · Unit ${n}`;
  el.querySelector("[data-ltitle]").textContent = (lg && lg.name) || "";
  const q = el.querySelector("[data-lq]");
  if (a) {
    const qq = (window.QBANK.find((x) => x.id === qid) || {}).q || "";
    q.hidden = false;
    q.innerHTML = `<b>Question:</b> ${esc(qq)}`;
  } else q.hidden = true;
  const note = el.querySelector("[data-lnote]");
  note.hidden = false;
  note.innerHTML = (a && a.logic ? `<b>What they are testing:</b> ${esc(a.logic)}<br>` : "")
    + (a && a.how ? `<b>Learn it this way:</b> ${esc(a.how)}<br>` : "")
    + (lg && lg.from ? `<b>It starts from:</b> ${esc(lg.from)}<br>` : "")
    + (lg && lg.to ? `<b>It leaves you asking:</b> ${esc(lg.to)}` : "");
  el.querySelector("[data-ldots]").innerHTML = logicSteps.map(() => "<i></i>").join("");
  renderVideos(el, sub, n, vid, lg);
  el.hidden = false;
  showPane(pane || (steps.length ? "logic" : "video"));
  paintLogic();
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce && !pane) startLogic(); else stopLogic();
}

/* One or two short clips per unit, matched against the unit's own words.
   The rows are buttons, not links: tapping one swaps in a YouTube embed right
   here. No iframe is created until that tap, so the page still opens and still
   works with no connection — and closing the reel removes the iframe, which is
   the only way to be sure the audio stops. */
let vidListHTML = "";

function renderVideos(el, sub, n, vid, lg) {
  const box = el.querySelector("[data-lvids]");
  const note = el.querySelector("[data-lvnote]");
  const name = (lg && lg.name)
    || ((TOP[sub] || []).find((u) => u.n === Number(n)) || {}).name
    || "this unit";
  el._vidData = vid || null;
  vidListHTML = "";
  if (vid && vid.v && vid.v.length) {
    box.innerHTML = vid.v.map((v, i) => `<button type="button" class="vidrow" data-vplay="${i}">
      <span class="vglyph">▶</span>
      <span><b>${esc(v.t)}</b><span class="vm">${esc(v.ch)}${v.len ? " · " + esc(v.len) : ""}</span></span>
    </button>`).join("");
    note.innerHTML = `One or two clips for the whole unit, so the same clip covers every wording of the question. `
      + `They come from channels that teach these exact papers — NSG · IOE and CSIT, and easycsit.com — `
      + `and only when the clip's title covers this unit's own words. `
      + (location.protocol === "file:"
        ? `Opened from this folder, a tap sends the clip to YouTube; nothing loads before that.`
        : `Tap one to play it here; nothing loads before that.`)
      + `<br><a class="vidsearch" href="https://www.youtube.com/results?search_query=${encodeURIComponent(vid.q)}" target="_blank" rel="noopener noreferrer">More videos on ${esc(name)}</a>`;
  } else {
    box.innerHTML = "";
    note.innerHTML = `None of the checked CSIT channels has a clip whose title matches this unit, so nothing is claimed here — search instead.`
      + `<br><a class="vidsearch" href="https://www.youtube.com/results?search_query=${encodeURIComponent(name + " explained")}" target="_blank" rel="noopener noreferrer">Search YouTube for “${esc(name)}”</a>`;
  }
}

function playVideo(i) {
  const box = logicEl.querySelector("[data-lvids]");
  const vid = logicEl._vidData;
  const v = vid && vid.v && vid.v[i];
  if (!v) return;
  /* A file:// page sends no Referer, and YouTube's player refuses to start
     without one (error 153). Rather than show a broken frame, open the clip
     where it is guaranteed to work. */
  if (location.protocol === "file:") {
    window.open(`https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}`, "_blank", "noopener");
    return;
  }
  if (!box.querySelector(".vidframe")) vidListHTML = box.innerHTML;
  box.innerHTML = `<div class="vidhead"><b>${esc(v.t)}</b>
      <button type="button" class="vidback" data-vback>← List</button></div>
    <div class="vidframe"><iframe
      src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&amp;rel=0&amp;modestbranding=1"
      title="${esc(v.t)}"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
    <a class="vidopen" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}" target="_blank" rel="noopener noreferrer">Open on YouTube</a>`;
}

function killVideo() {
  const box = logicEl && logicEl.querySelector("[data-lvids]");
  if (box && box.querySelector(".vidframe")) box.innerHTML = vidListHTML;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-playlogic]");
  if (b) { e.preventDefault(); openLogic(b.dataset.playlogic); return; }
  const ub = e.target.closest("[data-playunit]");
  if (ub) { e.preventDefault(); const [s, n] = ub.dataset.playunit.split(":"); openLogic(null, s, Number(n)); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && logicEl && !logicEl.hidden) closeLogic();
});


function unitHeat(sub) {
  const rows = (TOP[sub] || []).map((u) => ({ n: u.n, name: u.name, q: 0, m: 0 }));
  const byN = new Map(rows.map((r) => [r.n, r]));
  for (const q of window.QBANK) {
    if (q.s !== sub) continue;
    const a = ansOf(q.id);
    if (!a || !a.u) continue;
    const r = byN.get(Number(a.u));
    if (r) { r.q++; r.m += Number(q.marks) || 5; }
  }
  return rows.sort((a, b) => b.m - a.m || b.q - a.q || a.n - b.n);
}

/* =========================================================
   TOPICS
   ========================================================= */
let topicSub = "se";

/* unit-learned flags — the same key index.html counts, so ticking here moves the tracker there */
const PROG_KEY = "csit6.progress.v1";
const OLD_UNIT_KEY = "csit6.learned.units";
function readProgress() {
  try { return JSON.parse(localStorage.getItem(PROG_KEY)) || {}; } catch (e) { return {}; }
}
(function migrateOldUnits() {
  let old = {};
  try { old = JSON.parse(localStorage.getItem(OLD_UNIT_KEY)) || {}; } catch (e) {}
  const st = readProgress();
  let touched = false;
  for (const k in old) {
    const m = /^([a-z]+)-(\d+)$/.exec(k);
    if (!m) continue;
    st[m[1]] = st[m[1]] || {};
    if (!st[m[1]][m[2]]) { st[m[1]][m[2]] = true; touched = true; }
  }
  if (touched) { try { localStorage.setItem(PROG_KEY, JSON.stringify(st)); } catch (e) {} }
})();
const readUnits = () => readProgress();
const setUnitDone = (sub, n) => {
  const st = readProgress();
  st[sub] = st[sub] || {};
  st[sub][n] = true;
  try { localStorage.setItem(PROG_KEY, JSON.stringify(st)); } catch (e) {}
};
window.UNITDONE = readUnits;
window.setUnitDone = setUnitDone;

function openTopic(sub, n) {
  route = { view: "topic", sub, unit: n };
  try { history.replaceState(null, "", "#topic-" + sub + "-" + n); } catch (e) {}
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === "topics"));
  render();
  window.scrollTo(0, 0);
}

function topicsView() {
  const units = TOP[topicSub] || [];
  const heat = unitHeat(topicSub);
  const maxM = Math.max(1, ...heat.map((r) => r.m));
  const totalQ = window.QBANK.filter((q) => q.s === topicSub).length;
  const totalM = window.QBANK.filter((q) => q.s === topicSub).reduce((s, q) => s + (Number(q.marks) || 5), 0);
  const done = window.UNITDONE ? window.UNITDONE() : {};

  view.innerHTML = `
    <h1>Topics</h1>
    <p class="sub">Every unit of all six papers, as a causal chain you can follow once and remember — not a summary to re-read. Hover any past question to see what the examiner is testing.</p>
    <div class="subchips">${SUBORDER.map((s) => `<button data-sub="${s}" class="${s === topicSub ? "on" : ""}">${SUBJ[s]}</button>`).join("")}</div>
    ${units.length ? `
    <div class="panel" style="margin-bottom:16px">
      <div class="kithead" style="margin-bottom:6px"><b>Where the marks are · ${SUBJ[topicSub]}</b>
        <span style="font:11.5px ui-monospace,monospace;color:var(--dim)">${totalQ} questions · ${totalM} marks across past papers</span></div>

/* =========================================================
   SURE SHOT
   ========================================================= */
let sureSub = "se";
let sureAll = false;
const SURE_KEY = "csit6.sure.v1";
function loadSureMem() {
  try { return JSON.parse(localStorage.getItem(SURE_KEY)) || {}; } catch (e) { return {}; }
}
const SURE_MEM = loadSureMem();
const SURE_OPEN = new Set();
const saveSureMem = () => { try { localStorage.setItem(SURE_KEY, JSON.stringify(SURE_MEM)); } catch (e) {} };

/* The typed recall test for a sure shot. Same scorer, same reversal net and same
   repair pointer as the One Shot gate, so an answer that passes here is the
   answer the full card would accept. */
const SURE_LAST = {};
const SURE_SAID = {};
function sureCheck(key, said) {
  const [sub, ns] = key.split(".");
  const unit = (((window.SURE || {}).subjects || {})[sub] || { units: [] }).units.find((u) => u.n === Number(ns));
  /* score the answer to the question the card leads with, not a different unit gate */
  const gate = unit && unit.top ? { q: unit.top.q, a: unit.top.gateA } : (unit && unit.gate);
  if (!gate) return { pass: false, cls: "gateres", html: "This unit has no gate yet." };
  const words = String(said).trim().split(/\s+/).filter(Boolean).length;
  if (words < 12) {
    return { pass: false, cls: "gateres", html: words < 4
      ? "Write a sentence first — four words cannot show a mechanism."
      : "Too thin. The marker wants the claim, the mechanism and the consequence — write the whole answer before you check it." };
  }
  const flat = " " + String(said).toLowerCase().replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim() + " ";
  /* the top answer's own inversion, not the unit gate's (they are different questions) */
  const anti = (unit && unit.top && unit.top.anti) ? [unit.top.anti] : [];
  const reversed = anti.find((p) =>
    flat.includes(" " + String(p).toLowerCase().replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim() + " ")
  ) || "";
  const lg = ((window.LOGIC || {})[sub] || []).find((u) => u.n === Number(ns)) || null;
  if (reversed) {
    const stems = keyIdeas(reversed).map((k) => k.stem);
    const best = (((lg && lg.steps) || []).map((s) => {
      const f = " " + (s.t + " " + s.d).toLowerCase().replace(/[^a-z0-9]+/g, " ") + " ";
      return { t: s.t, n: stems.filter((st) => f.includes(st)).length };
    }).sort((a, b) => b.n - a.n)[0]) || null;
    return { pass: false, cls: "gateres", html: `<b>Reversed mechanism.</b> Those are the card's words, but the cause and the effect are the wrong way round, so every sentence still scores and the argument is backwards.`
      + (best && best.n ? `<br>Re-read only: <b>${esc(best.t)}</b>.` : "")
      + `<br>Say the card's direction out loud once, then write the answer again.` };
  }
  const c = coverage(said, gate.a);
  const need = passNeed(c.total);
  if (c.hit.length >= need) {
    return { pass: true, cls: "gateres pass", html: `✓ <b>${c.hit.length} of ${c.total}</b> marked ideas — the mechanism is there. Marked memorised; the next answer is ready.` };
  }
  const missed = new Set(c.miss.map((m) => m.stem));
  const repair = ((lg && lg.steps) || []).filter((s) => {
    const f = (" " + s.t + " " + s.d + " ").toLowerCase().replace(/[^a-z0-9]+/g, " ");
    return [...missed].some((st) => f.includes(st));
  }).map((s) => s.t);
  const missChips = c.miss.slice(0, 6).map((m) => `<span class="miss">${esc(m.word)}</span>`).join(" ");
  return { pass: false, cls: "gateres", html: `<b>${c.hit.length} of ${c.total}</b> marked ideas — ${need} needed. Still missing: ${missChips}${c.miss.length > 6 ? " …" : ""}`
    + (repair.length ? `<br>Re-read only: <b>${repair.map(esc).join(", ")}</b>.` : "")
    + `<br>Say the whole answer out loud once, then write it again. Do not copy the marked answer.` };
}

  catch (e) { return "se"; }
})();
let whyLean = false;
let whyPlay = { on: false, i: 0 };

const logicOf = (sub) => (LOGIC[sub] || []);

function whyText(u) {
  return [u.name + ".", u.oneLiner, u.hook, u.why, u.story, u.idea,
    ...u.steps.map((s, i) => `Step ${i + 1}: ${s.t}. ${s.d}`), u.exam].join(" ");
}

function stopSpeech() {
  whyPlay.on = false;
  try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch (e) {}
  view.querySelectorAll(".why.playing").forEach((c) => c.classList.remove("playing"));
}

function speakWhy(text, onEnd) {
  if (!("speechSynthesis" in window)) { if (onEnd) onEnd(); return; }
  const synth = window.speechSynthesis;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const voices = synth.getVoices();
  const v = voices.find((x) => /^en-IN/i.test(x.lang)) || voices.find((x) => /^en/i.test(x.lang));
  if (v) u.voice = v;
  u.lang = v ? v.lang : "en-IN";
  u.rate = 0.95;
  let done = false, timer = 0;
  const finish = () => { if (done) return; done = true; clearTimeout(timer); if (onEnd) onEnd(); };
  u.onend = finish;
  u.onerror = finish;
  timer = setTimeout(finish, Math.max(9000, text.split(/\s+/).length * 430));
  synth.speak(u);
}

function openWhy(sub, n) {
  stopSpeech();
  if (sub && SUBORDER.includes(sub)) whySub = sub;
  try { localStorage.setItem("csit6.why.sub", whySub); } catch (e) {}
  route = { view: "why" };

      setCardOpen(card, true);
      requestAnimationFrame(() => card.scrollIntoView({ block: "start", behavior: "smooth" }));

  window.scrollTo(0, 0);
}

/* =========================================================
   ONE SHOT — one ordered pass over all 54 units, each closed by a test
   ========================================================= */
const SHOT_KEY = "csit6.oneshot.v1";
const DAYMS = 86400000;
/* exam order: the run follows the calendar, not the menu */
const EXAMS = [
  ["se", "2026-12-10", "CSC375", "SE"],
  ["cdc", "2026-12-13", "CSC376", "CDC"],
  ["egov", "2026-12-16", "CSC377", "EGOV"],
  ["ncc", "2026-12-20", "CSC378", "NCC"],
  ["tw", "2026-12-23", "CSC379", "TW"],
  ["ecom", "2026-12-27", "CSC381", "ECOM"],
];

function loadShot() {
  try {
    const s = JSON.parse(localStorage.getItem(SHOT_KEY)) || {};
    return { closed: s.closed || {}, requeue: s.requeue || {}, warm: s.warm || {},
      warmSeen: s.warmSeen || {}, days: s.days || {} };
  } catch (e) { return { closed: {}, requeue: {}, warm: {}, warmSeen: {}, days: {} }; }
}
const SHOT = loadShot();

/* The reader's own compression of each unit. This is the only thing that ever
   needs re-reading: 54 sentences in their words, not 54 units of notes. */
const LINES_KEY = "csit6.lines.v1";
function loadLines() {
  try { return JSON.parse(localStorage.getItem(LINES_KEY)) || {}; } catch (e) { return {}; }
}
let LINES = loadLines();
const saveLines = () => { try { localStorage.setItem(LINES_KEY, JSON.stringify(LINES)); } catch (e) {} };
const saveShot = () => { try { localStorage.setItem(SHOT_KEY, JSON.stringify(SHOT)); } catch (e) {} };

let SHOT_RUN = null;
function shotRun() {
  if (SHOT_RUN) return SHOT_RUN;
  const chain = window.CHAIN || {};
  SHOT_RUN = [];
  for (const [s, date, code] of EXAMS) {
    for (const u of chain[s] || []) {
      SHOT_RUN.push({ s, date, code, n: u.n, name: u.name, from: u.from, to: u.to, gate: u.gate, key: s + "." + u.n });
    }
  }
  return SHOT_RUN;
}

const startOfDay = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysTo = (iso) => Math.round((new Date(iso + "T00:00:00") - startOfDay()) / DAYMS);
const fmtDay = (d) => d.toLocaleDateString(undefined, { day: "numeric", month: "short" });

/* ---- warm-up: 3 units retired before today, re-asked cold ----
   Retiring a unit is a claim about tomorrow, not just about now. Each day the
   run puts three of them back on the spot; if one has slipped, it returns to
   today's queue instead of waiting for the exam to reveal it. */
/* How many units come back cold each day. During the run it is 3, on top of the
   new cards; once every unit is retired there is nothing else to do, so it rises
   to 6 and the whole syllabus keeps turning over before the papers start. */
function warmCount(run) {
  return run.some((x) => !SHOT.closed[x.key]) ? 3 : 6;
}

function warmPicks(run) {
  const date = new Date().toISOString().slice(0, 10);
  const t0 = startOfDay().getTime();
  SHOT.warm = SHOT.warm || {};
  SHOT.warmSeen = SHOT.warmSeen || {};
  const rec = SHOT.warm[date] || { list: [], done: [] };
  const closedBefore = run.filter((x) => SHOT.closed[x.key] && SHOT.closed[x.key] < t0);
  if (!closedBefore.length) return [];

  /* A paper already sat needs no rehearsal: drop its units from the pool. */
  const live = closedBefore.filter((x) => {
    const e = EXAMS.find(([s]) => s === x.s);
    return !e || daysTo(e[1]) >= 0;
  });
  const pool = live.length ? live : closedBefore;
  const papers = EXAMS.filter(([, d]) => daysTo(d) >= 0);
  const orderOf = (s) => EXAMS.findIndex((e) => e[0] === s);

  /* Staleness, not a rotation: a unit never rehearsed since it was retired goes
     first, then the one seen longest ago. Retirement counts as the last sighting,
     so a unit closed yesterday cannot jump ahead of one closed a week ago. */
  const lastOf = (x) => SHOT.warmSeen[x.key] || SHOT.closed[x.key] || 0;
  const byStale = (a, b) => (lastOf(a) - lastOf(b)) || (orderOf(a.s) - orderOf(b.s)) || (a.n - b.n);

  const n = warmCount(run);

  let list = (rec.list || []).filter((k) => pool.some((x) => x.key === k));
  if (!list.length) {
    const nextSub = papers[0] ? papers[0][0] : null;
    const afterSub = papers[1] ? papers[1][0] : null;
    const dNext = papers[0] ? Math.max(1, daysTo(papers[0][1])) : 99;
    const s1 = pool.filter((x) => x.s === nextSub).sort(byStale);
    const s2 = pool.filter((x) => x.s === afterSub).sort(byStale);

    /* Two thirds of the slots go to the next paper, but never fewer than the
       pace that sees every still-unrehearsed unit of that paper once before it.
       When the exam is close the next paper takes the whole day rather than
       leave a unit unseen; once they are all seen, the normal count returns. */
    const unseen1 = s1.filter((x) => !SHOT.warmSeen[x.key] || SHOT.warmSeen[x.key] < SHOT.closed[x.key]).length;
    const pace = unseen1 ? Math.ceil(unseen1 / dNext) : 0;
    const k1 = Math.min(s1.length, Math.max(Math.ceil((n * 2) / 3), pace));
    const picks = s1.slice(0, k1);
    const k2 = Math.min(n - picks.length, s2.length);
    picks.push(...s2.filter((x) => !picks.some((p) => p.key === x.key)).slice(0, k2));
    if (picks.length < n) {
      for (const x of pool.slice().sort(byStale)) {
        if (picks.length >= n) break;
        if (!picks.some((p) => p.key === x.key)) picks.push(x);
      }
    }
    list = picks.map((x) => x.key);
    rec.list = list;
    SHOT.warm[date] = rec;
    /* Stamp what was put on the spot, so tomorrow prefers the units that did
       not come up. That is what stops a retired unit being starved before its
       paper while others are rehearsed twice. */
    for (const k of list) SHOT.warmSeen[k] = t0;
    saveShot();
  }
  return list.map((k) => pool.find((x) => x.key === k)).filter((x) => x && !rec.done.includes(x.key));
}

function shotPlan() {
  const run = shotRun();
  const open = run.filter((x) => !SHOT.closed[x.key]);
  /* phase 1 must be finished two days before the first paper */
  const first = new Date(EXAMS[0][1] + "T00:00:00");
  const end = new Date(first.getTime() - 2 * DAYMS);
  const daysLeft = Math.max(1, Math.ceil((end - startOfDay()) / DAYMS));
  const perDay = Math.min(8, Math.max(1, Math.ceil(open.length / daysLeft)));
  /* a unit the reader sent back comes last in the same session, never next week */
  const fresh = open.filter((x) => !SHOT.requeue[x.key]).slice(0, perDay);
  const again = open.filter((x) => SHOT.requeue[x.key]).slice(0, 3);
  const today = fresh.length ? fresh.concat(again) : open.slice(0, perDay);
  return { run, open, perDay, today, daysLeft, end };
}

function unitQuestions(sub, n, limit) {
  return window.QBANK
    .filter((q) => {
      if (q.s !== sub) return false;
      const a = ansOf(q.id);
      return a && Number(a.u) === Number(n);
    })
    .sort((a, b) => (Number(b.marks) || 5) - (Number(a.marks) || 5))
    .slice(0, limit);
}

function markLearned(sub, n) {
  try {
    const st = JSON.parse(localStorage.getItem(PROG_KEY)) || {};
    st[sub] = st[sub] || {};
    st[sub][n] = true;
    localStorage.setItem(PROG_KEY, JSON.stringify(st));
  } catch (e) {}
}

function unmarkLearned(sub, n) {
  try {
    const st = JSON.parse(localStorage.getItem(PROG_KEY)) || {};
    if (st[sub]) { delete st[sub][n]; localStorage.setItem(PROG_KEY, JSON.stringify(st)); }
  } catch (e) {}
}

/* ---- typed recall scoring -------------------------------------------------
   The reader writes the answer before seeing it. We do not try to grade English:
   we check whether the marked ideas are present, using a 5-letter stem so
   "dependable" counts for "dependability". Three hits and 35% is a pass.      */
const SAY_STOP = new Set(("about above after again against also because been before being below between both cannot could doing down during each every from further have having here into itself might more most must only other over same shall should some such than that their theirs them then there these they this those through under until very what when where which while whom will with would your yours").split(" "));

function keyIdeas(text) {
  const seen = new Set();
  const out = [];
  for (const raw of String(text || "").toLowerCase().split(/[^a-z0-9]+/)) {
    if (raw.length < 5 || SAY_STOP.has(raw)) continue;
    const stem = raw.slice(0, 5);
    if (seen.has(stem)) continue;
    seen.add(stem);
    out.push({ stem, word: raw });
  }
  return out;
}

function coverage(said, target) {
  const keys = keyIdeas(target);
  const flat = " " + String(said || "").toLowerCase().replace(/[^a-z0-9]+/g, " ") + " ";
  const hit = [], miss = [];
  for (const k of keys) (flat.includes(k.stem) ? hit : miss).push(k);
  const total = keys.length || 1;
  return { hit, miss, total, pct: Math.round((hit.length / total) * 100) };
}

/* A pass is 30% of the marked ideas, never fewer than 3 and never more than 10,
   so a unit with a dense model answer does not demand a transcription. */

          <p class="gatea" hidden>${esc(x.gate ? x.gate.a : "")}</p>
          <div class="gatebtns">
            <button class="ghost" data-wh>Still solid — it stays retired</button>
            <button class="ghost" data-wr>Reopen into today's queue</button>
          </div>
        </div>
      </div>`).join("")}
    </div>`;
    })() : ""}

    <div class="whytools" style="margin-bottom:14px">
      <button class="ghost" id="shotAll">${shotShowAll ? "Hide the full run" : "Show all " + run.length + " in order"}</button>
      <button class="ghost" id="shotLines">${shotShowLines ? "Hide your lines" : "Your " + Object.keys(LINES).filter((k) => run.some((x) => x.key === k)).length + " of " + run.length + " lines"}</button>
      <span class="hint">${closedToday} closed today${targetDone ? " \u2014 daily target met, the rest can wait" : ""} · ${plan.open.length} left · ${plan.daysLeft} day${plan.daysLeft === 1 ? "" : "s"} to the end of the logic run · next: ${SUBJ[nextExam[0]]}</span>
    </div>

    ${shotShowAll ? `<div class="panel" style="margin-bottom:16px">
      <div class="kithead" style="margin-bottom:8px"><b>The full run</b><span style="font:11px ui-monospace,monospace;color:var(--dim)">exam order · click a unit to jump to it</span></div>
      ${EXAMS.map(([s]) => {
        const all = run.filter((x) => x.s === s);
        return `<div style="margin-bottom:10px">
          <div class="wlab" style="margin-bottom:2px">${SUBJ[s]} · ${all.filter((x) => SHOT.closed[x.key]).length}/${all.length}</div>
          <ul class="rowlist">${all.map((x) => {
            const isClosed = !!SHOT.closed[x.key];
            return `<li class="${isClosed ? "closed" : ""}">
              <span class="dot"></span><span class="nm">${x.n}. ${esc(x.name)}</span>
              <em>${isClosed ? "retired" : ""}</em>
              <button class="ghost" data-jump="${x.key}">${isClosed ? "reopen" : "open"}</button>
            </li>`;
          }).join("")}</ul></div>`;
      }).join("")}
    </div>` : ""}

    ${shotShowLines ? `<div class="panel lines" style="margin-bottom:16px">
      <div class="kithead" style="margin-bottom:8px"><b>Your lines</b><span style="font:11px ui-monospace,monospace;color:var(--dim)">the only thing to re-read before a paper</span></div>
      <p style="margin:0 0 10px;font-size:12.5px;color:var(--mut);line-height:1.6">Every card asks for one sentence in your own words. Together they are the syllabus at a glance &mdash; if a line is missing, that unit was closed without being compressed, and it is the one to redo.</p>
      ${EXAMS.map(([s]) => {
        const all = run.filter((x) => x.s === s);
        const kept = all.filter((x) => LINES[x.key]).length;
        const partsOf = (x) => (((LOGIC[x.s] || []).find((u) => u.n === x.n) || {}).steps || []).map((p) => p.t);
        return `<div class="linesub">
          <div class="wlab" style="margin-bottom:4px">${SUBJ[s]} · ${kept}/${all.length} kept</div>
          <ol>${all.map((x) => {
            const parts = partsOf(x);
            return `<li class="${LINES[x.key] ? "" : "empty"}"><span class="ln">${x.n}</span><div class="lbody">
              <span class="lt">${LINES[x.key] ? esc(LINES[x.key]) : "not kept yet"}</span>
              ${parts.length ? `<span class="lp">${parts.map(esc).join(" \u00b7 ")}</span>` : ""}
            </div></li>`;
          }).join("")}</ol>
        </div>`;
      }).join("")}
      <button class="ghost" id="copyLines">Copy the whole sheet</button>
      <span class="keepmsg" id="copyMsg"></span>
    </div>` : ""}

    ${cards.length ? cards.map((x) => shotCard(x, posLabel(x))).join("") : `<div class="panel" style="text-align:center;padding:26px 18px">
      <p style="margin:0 0 6px;font-size:16px;color:var(--txt);font-weight:600">Today's queue is empty — the whole run is retired.</p>
      <p style="margin:0;font-size:13px;color:var(--mut)">Nothing left to understand for the first time. From here it is recall only: <a href="#sure">Sure Shot</a> for this paper, then <a href="#drill">Drill</a>.</p>
    </div>`}

    <div class="panel" style="margin-top:18px">
      <div class="kithead" style="margin-bottom:6px"><b>Why this ends the revisiting</b></div>
      <p style="margin:0;font-size:13px;color:var(--mut);line-height:1.7">
        Reading a unit twice feels like learning and is not. Here every unit is read once and then <b style="color:var(--txt)">produced</b>:
        the one-liner out loud, the five moving parts named, before the card is allowed to close. A unit that fails the test
        comes back <b style="color:var(--txt)">inside the same session</b>, not next week, so the gap is fixed while the idea is still warm.
        The chain line at the top of each card is the one you just closed, so the ${run.length} units stay one argument instead of ${run.length} islands.</p>
    </div>`;

  const allBtn = document.getElementById("shotAll");
  if (allBtn) allBtn.addEventListener("click", () => { shotShowAll = !shotShowAll; shotView(); });

  view.querySelectorAll("[data-start]").forEach((b) => b.addEventListener("click", () => {
    const t = document.getElementById(b.dataset.start);
    if (t) t.scrollIntoView({ block: "start", behavior: "smooth" });
  }));

  const linesBtn = document.getElementById("shotLines");
  if (linesBtn) linesBtn.addEventListener("click", () => { shotShowLines = !shotShowLines; shotView(); });

  const copyBtn = document.getElementById("copyLines");
  if (copyBtn) copyBtn.addEventListener("click", async () => {
    const run = shotRun();
    const text = EXAMS.map(([s]) => {
      const all = run.filter((x) => x.s === s);
      return SUBJ[s] + "\n" + all.map((x) => {
        const parts = (((LOGIC[x.s] || []).find((u) => u.n === x.n) || {}).steps || []).map((p) => p.t);
        return `${x.n}. ${x.name}\n   ${LINES[x.key] || "-"}` + (parts.length ? `\n   Parts: ${parts.join(" | ")}` : "");
      }).join("\n");
    }).join("\n\n");
    const msg = document.getElementById("copyMsg");
    try {
      await navigator.clipboard.writeText(text);
      if (msg) msg.textContent = "Copied — paste it anywhere before the paper.";
    } catch (e) {
      if (msg) msg.textContent = "Copy blocked here — open the page over http, or select the lines by hand.";
    }
  });

  view.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => {
    const key = b.dataset.jump;
    if (SHOT.closed[key] && b.textContent.trim() === "reopen") {
      delete SHOT.closed[key];
      saveShot();
    }
    shotFocus = key;
    shotShowAll = false;
    shotView();
    const card = document.getElementById("shot-" + key.replace(".", "-"));
    if (card) requestAnimationFrame(() => card.scrollIntoView({ block: "start", behavior: "smooth" }));
  }));

  /* after a card leaves, keep the reader at the top of the next one instead of mid-page */
  const advance = () => {
    shotView();
    const next = document.querySelector(".shot");
    if (next) next.scrollIntoView({ block: "start" });
    else window.scrollTo(0, 0);
  };

  view.querySelectorAll(".warmrow").forEach((row) => {
    const key = row.dataset.wkey;
    const ask = row.querySelector("[data-wq]");
    const body = row.querySelector("[data-wbody]");
    const gaBtn = row.querySelector("[data-wa]");
    const ga = row.querySelector(".gatea");
    const mark = (k) => {
      const date = new Date().toISOString().slice(0, 10);
      const rec = SHOT.warm[date] || (SHOT.warm[date] = { list: [], done: [] });
      if (!rec.done.includes(k)) rec.done.push(k);
      saveShot();
    };

    if (ask) ask.addEventListener("click", () => {
      body.hidden = false;
      ask.style.display = "none";
    });
    if (gaBtn) gaBtn.addEventListener("click", () => {
      ga.hidden = false;
      gaBtn.style.display = "none";
    });
    row.querySelector("[data-wh]").addEventListener("click", () => {
      mark(key);
      shotView();
    });
    row.querySelector("[data-wr]").addEventListener("click", () => {
      delete SHOT.closed[key];
      SHOT.requeue[key] = 1;
      mark(key);
      saveShot();
      unmarkLearned(key.split(".")[0], Number(key.split(".")[1]));
      shotView();
    });
  });

  view.querySelectorAll(".shot").forEach((card) => {
    const key = card.dataset.key;
    const gateBtn = card.querySelector("[data-gate]");
    const gq = card.querySelector(".gateq");
    const body = card.querySelector("[data-gbody]");
    const gaBtn = card.querySelector("[data-ga]");
    const ga = card.querySelector(".gatea");
    const ticks = [...card.querySelectorAll("[data-tick]")];
    const closeBtn = card.querySelector("[data-close]");
    const againBtn = card.querySelector("[data-again]");
    const ansBtn = card.querySelector("[data-ans]");
    const say = card.querySelector("[data-say]");
    const checkBtn = card.querySelector("[data-check]");
    const res = card.querySelector("[data-res]");
    const oneTick = card.querySelector('[data-tick="one"]');
    const target = card.querySelector(".gatea")?.textContent || "";

    const runCheck = () => {
      const said = say.value.trim();
      const words = said.split(/\s+/).filter(Boolean).length;
      /* Committing is what unlocks the marking scheme. A reader who has typed a
         real attempt gets the answer; one who has not stays locked out, so the
         test cannot be passed by reading first and writing second. */
      if (said && gaBtn && gaBtn.disabled) {
        gaBtn.disabled = false;
        gaBtn.textContent = "Show the marked answer";
      }
      if (said && ansBtn && ansBtn.disabled) {
        ansBtn.disabled = false;
        ansBtn.textContent = "Show all " + (card.dataset.qcount || "") + " questions";
      }
      if (words < 12) {
        res.hidden = false;
        res.className = "gateres";
        res.innerHTML = words < 4
          ? "Write a sentence first \u2014 four words cannot show a mechanism."
          : "Too thin. The marker wants the claim, the mechanism and the consequence \u2014 write the whole answer before you check it.";
        return;
      }
      /* Vocabulary alone cannot tell a correct mechanism from its reverse, so
         each unit carries the fluent inversion a reader is most likely to
         write. If the answer states it, the words all score but the reasoning
         is backwards: fail on the direction, not on the word count. */
      const [gsub, gnum] = key.split(".");
      const unit = ((window.CHAIN || {})[gsub] || []).find((u) => u.n === Number(gnum));
      const flatSaid = " " + said.toLowerCase().replace(/[^a-z0-9]+/g, " ") + " ";
      const anti = (unit && unit.gate && unit.gate.anti) || [];
      const reversed = anti.find((p) =>
        flatSaid.includes(" " + String(p).toLowerCase().replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim() + " ")
      ) || "";
      if (reversed) {
        const unitLogic = ((window.LOGIC || {})[gsub] || []).find((u) => u.n === Number(gnum)) || null;
        const stems = keyIdeas(reversed).map((k) => k.stem);
        const best = (((unitLogic && unitLogic.steps) || []).map((s) => {
          const f = " " + (s.t + " " + s.d).toLowerCase().replace(/[^a-z0-9]+/g, " ") + " ";
          return { t: s.t, n: stems.filter((st) => f.includes(st)).length };
        }).sort((a, b) => b.n - a.n)[0]) || null;
        res.hidden = false;
        res.className = "gateres";
        res.innerHTML = `<b>Reversed mechanism.</b> Those are the card's words, but the cause and the effect are the wrong way round, so every sentence still scores and the argument is backwards.`
          + (best && best.n ? `<br>Re-read only: <b>${esc(best.t)}</b>.` : "")
          + `<br>Say the card's direction out loud once, then write the answer again.`;
        return;
      }
      const c = coverage(said, target);
      const need = passNeed(c.total);
      const pass = c.hit.length >= need;
      res.hidden = false;
      res.className = "gateres" + (pass ? " pass" : "");
      if (pass) {
        res.innerHTML = `\u2713 <b>${c.hit.length} of ${c.total} marked ideas</b> \u2014 the mechanism is there. The one-liner is ticked for you; name the five parts and close it.`;
        if (oneTick && !oneTick.checked) {
          oneTick.checked = true;
          oneTick.dispatchEvent(new Event("change"));
        }
      } else {
        /* Point at the mechanism step that was missing, not just the word.
           The repair is one part of the card, so the unit never has to be re-read whole. */
        const lg = (LOGIC[key.split(".")[0]] || []).find((u) => u.n === Number(key.split(".")[1])) || null;
        const missed = new Set(c.miss.map((m) => m.stem));
        const repair = ((lg && lg.steps) || []).filter((s) => {
          const flat = (" " + s.t + " " + s.d + " ").toLowerCase().replace(/[^a-z0-9]+/g, " ");
          return [...missed].some((st) => flat.includes(st));
        }).map((s) => s.t);
        const missChips = c.miss.slice(0, 6).map((m) => `<span class="miss">${esc(m.word)}</span>`).join(" ");
        res.innerHTML = `<b>${c.hit.length} of ${c.total}</b> marked ideas \u2014 ${need} needed. Still missing: ${missChips}${c.miss.length > 6 ? " \u2026" : ""}`
          + (repair.length ? `<br>Re-read only: <b>${repair.map(esc).join(", ")}</b>.` : "")
          + `<br>Say the whole answer out loud once, then write it again. Do not copy the marked answer.`;
      }
    };
    if (checkBtn) checkBtn.addEventListener("click", runCheck);
    if (say) say.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); runCheck(); }
    });

    /* A unit may only be retired when the reader can name its parts AND has
       compressed it into their own sentence. The line is what replaces re-reading
       before a paper, so a missing line is not a warning: it blocks the close. */
    const sync = () => {
      const hit = ticks.filter((t) => t.checked).length;
      const kept = !!(lineIn && lineIn.value.trim()) || !!LINES[key];
      closeBtn.disabled = hit < ticks.length || !kept;
      closeBtn.textContent = hit < ticks.length
        ? `Close — never revisit (${hit}/${ticks.length})`
        : kept ? "Close — never revisit" : "Write your one line, then close";
    };

    if (ansBtn) ansBtn.addEventListener("click", () => {
      if (ansBtn.disabled) return;
      const box = card.querySelector("[data-ansbody]");
      box.hidden = !box.hidden;
      ansBtn.textContent = box.hidden
        ? "Show all " + (card.dataset.qcount || "") + " questions"
        : "Hide the question set";
      if (!box.hidden) wireKit(box);
    });

    /* The unit's own line, kept by the reader. Saved as they type, so a closed
       card still gives them something to revisit that is not the notes. */
    const lineIn = card.querySelector("[data-line]");
    const lineMsg = card.querySelector("[data-lmsg]");
    if (lineIn) {
      const keep = () => {
        const v = lineIn.value.trim();
        if (v) LINES[key] = v; else delete LINES[key];
        saveLines();
        const run = shotRun();
        const total = Object.keys(LINES).filter((k) => run.some((u) => u.key === k)).length;
        if (lineMsg) lineMsg.textContent = v ? `Kept \u2014 ${total} of ${run.length} lines.` : "";
        const btn = document.getElementById("shotLines");
        if (btn) btn.textContent = shotShowLines ? "Hide your lines" : `Your ${total} of ${run.length} lines`;
        sync();
      };
      lineIn.addEventListener("blur", keep);
      lineIn.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); keep(); lineIn.blur(); }
      });
    }

    if (gateBtn) gateBtn.addEventListener("click", () => {
      gq.hidden = false;
      body.hidden = false;
      gateBtn.style.display = "none";
    });

    /* One visible next action after the reading: open the gate and answer it. */
    card.querySelectorAll("[data-togate]").forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault();
      if (gateBtn && gateBtn.style.display !== "none") gateBtn.click();
      card.querySelector(".gate")?.scrollIntoView({ block: "start", behavior: "smooth" });
    }));

    if (gaBtn) gaBtn.addEventListener("click", () => {
      if (gaBtn.disabled) return;
      ga.hidden = false;
      gaBtn.style.display = "none";
    });

    ticks.forEach((t) => t.addEventListener("change", sync));
    sync();

    closeBtn.addEventListener("click", () => {
      if (closeBtn.disabled) return;
      SHOT.closed[key] = Date.now();
      delete SHOT.requeue[key];
      {
        const d = new Date().toISOString().slice(0, 10);
        SHOT.days = SHOT.days || {};
        SHOT.days[d] = (SHOT.days[d] || 0) + 1;
      }
      saveShot();
      markLearned(key.split(".")[0], Number(key.split(".")[1]));
      if (shotFocus === key) shotFocus = null;
      card.classList.add("leaving");
      setTimeout(advance, 240);
    });

    againBtn.addEventListener("click", () => {
      SHOT.requeue[key] = (SHOT.requeue[key] || 0) + 1;
      saveShot();
      card.classList.add("leaving");
      setTimeout(advance, 240);
    });
  });
}

function openShot(sub, n) {
  shotFocus = sub && n ? sub + "." + n : null;
  route = { view: "shot" };
  try { history.replaceState(null, "", "#shot" + (sub && n ? "-" + sub + "-" + n : "")); } catch (e) {}
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === "shot"));
  shotView();
  const card = sub && n ? document.getElementById("shot-" + sub + "-" + n) : null;
  if (card) requestAnimationFrame(() => card.scrollIntoView({ block: "start", behavior: "smooth" }));
  else window.scrollTo(0, 0);
}

function sureView() {
  const SURE = window.SURE || { subjects: {} };
  const examOrder = (typeof EXAMS !== "undefined" ? EXAMS.map((e) => e[0]) : SUBORDER);
  const subs = examOrder.filter((s) => SURE.subjects[s]);

  const shownUnits = (s) => {
    const all = SURE.subjects[s].units || [];
    return sureAll ? all : all.slice(0, 5);
  };
  const groups = sureSub === "all" ? subs : subs.filter((s) => s === sureSub);
  const visible = groups.flatMap((s) => shownUnits(s).map((u) => ({ s, u })));
  const marks = visible.reduce((a, x) => a + x.u.m, 0);
  const marksDone = visible.reduce((a, x) => a + (SURE_MEM[x.s + "." + x.u.n] ? x.u.m : 0), 0);
  const done = visible.filter((x) => SURE_MEM[x.s + "." + x.u.n]).length;
  const allOpen = visible.length > 0 && visible.every((x) => SURE_OPEN.has(x.s + "." + x.u.n));
  const next = visible.find((x) => !SURE_MEM[x.s + "." + x.u.n]);
  const pct = marks ? Math.round((marksDone / marks) * 100) : 0;
  const allMarks = Object.values(SURE.subjects).reduce((a, s) => a + s.totalM, 0);
  const topMarks = Object.values(SURE.subjects).reduce(
    (a, s) => a + (s.units || []).slice(0, 5).reduce((b, u) => b + u.m, 0), 0);
  const topShare = allMarks ? Math.round((topMarks / allMarks) * 100) : 0;

  const card = (s, u, i) => {
    const key = s + "." + u.n;
    const mem = !!SURE_MEM[key];
    const open = SURE_OPEN.has(key);
    const top = u.ask && u.ask[0];
    const subShort = (SUBJ[s] || s).split(" ")[0];
    return `<div class="sureunit ${open ? "open" : ""}" id="sure-${s}-${u.n}">
      <div class="surehead" data-open="${key}">
        <span class="rk">${String(i + 1).padStart(2, "0")}</span>
        <div style="flex:1;min-width:0">
          <h3>${esc(u.name)}${mem ? ` <span class="chip" style="color:var(--acc);border-color:var(--acc)">memorised</span>` : ""}</h3>
          <div class="suremeta">
            <span class="sz">${u.q} questions</span>
            <span>${u.m} marks</span>
            <span>${u.share}% of ${subShort}</span>
            ${u.reps.length ? `<span class="mchip">${u.reps.length} word-for-word</span>` : ""}
          </div>
          <div class="surebar"><i style="width:${Math.min(100, u.share)}%"></i></div>
          ${top ? `<p class="sureq"><b>Most asked:</b> ${esc(top.q)}</p>` : ""}
        </div>
      </div>
      <div class="surebody">
        ${u.top ? `<h4>The question most likely to come</h4>
        <p class="sureq" style="margin-top:0">${esc(u.top.q)}</p>
        <p class="sureq" style="font-size:12px;margin-top:4px">${esc(u.top.y)} · ${u.top.marks} marks${u.top.rep > 1 ? ` · asked ${u.top.rep}×` : ""}</p>
        <h4>The answer to write</h4>
        <p class="sureans topans">${esc(u.top.ans)}</p>
        <h4>The points that earn the marks</h4>
        <ol class="surespine">${u.top.skel.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
        <p class="sureq" style="margin-top:10px"><b>Why it repeats:</b> ${esc(u.top.logic)}<br><b>How to own it:</b> ${esc(u.top.how)}</p>` : ""}
        <details class="suremore">
          <summary>The whole unit in one paragraph</summary>
          <p class="sureans">${esc(u.idea)}</p>
          ${u.one ? `<p class="sureq" style="margin-top:8px"><b>One line:</b> ${esc(u.one)}</p>` : ""}
        </details>
        <h4>Other wordings it answers (${u.ask.filter((a) => !u.top || a.id !== u.top.id).length} of ${u.q})</h4>
        <ul class="asklist">${u.ask.filter((a) => !u.top || a.id !== u.top.id).map((a) => `<li>${esc(a.y)} · ${a.marks}m${a.rep > 1 ? ` · ${a.rep}×` : ""} — ${esc(a.q)}</li>`).join("")}</ul>
        ${u.q > u.ask.length ? `<p class="sureq" style="font-size:12px">…and ${u.q - u.ask.length} more on the full card.</p>` : ""}
        <h4>Hit these points</h4>
        <div class="surekeys">${u.keys.map((k) => `<span>${esc(k)}</span>`).join("")}</div>
        ${u.top ? `<h4>Recall gate — type it from memory</h4>
          <p class="sureq" style="margin-top:0">${esc(u.top.q)}</p>
          <p class="sureq" style="font-size:12px;margin-top:2px">Pass = the answer's marked ideas and its five points, in any words. The full answer stays hidden until you check.</p>
          <textarea data-say="${key}" rows="3" placeholder="No looking. The claim, the mechanism, the consequence.">${esc(SURE_SAID[key] || "")}</textarea>
          <div class="sureacts" style="margin-top:8px">
            <button class="act" data-check="${key}">Check my answer</button>
            <button class="ghost" data-reveal="${key}">Show the full answer</button>
          </div>
          <div class="${SURE_LAST[key] ? SURE_LAST[key].cls : "gateres"}" data-res="${key}" ${SURE_LAST[key] ? "" : "hidden"}>${SURE_LAST[key] ? SURE_LAST[key].html : ""}</div>
          <div class="ansblock" data-ans="${key}">${esc(u.top.ans)}</div>` : ""}
        <div class="sureacts">
          <button class="mem ${mem ? "on" : ""}" data-mem="${key}">${mem ? "✓ Memorised" : "Mark memorised"}</button>
          ${u.top ? `<button class="ghost" data-playlogic="${u.top.id}">▶ Logic · Video</button>` : ""}
          <a class="link" href="#shot-${s}-${u.n}">Open the full card →</a>
        </div>
      </div>
    </div>`;
  };

  const clusters = REPS.filter((c) => sureSub === "all" || c.s === sureSub);

  view.innerHTML = `
    <h1>Sure shot</h1>
    <p class="sub">Ranked by the marks each unit actually carried across every past paper. The top five units per subject hold <b>${topShare}%</b> of all marks — that is ${Object.values(SURE.subjects).reduce((a, s) => a + Math.min(5, (s.units || []).length), 0)} answers to memorise instead of 54 units to read. Open one for the answer, the questions it covers, and the gate that proves you own it.</p>
    <div class="surecov">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">
        <div><span class="big">${done}/${visible.length}</span> <span class="cap">answers memorised</span></div>
        <div class="cap">${pct}% of the marks in this list · ${marksDone}/${marks} marks</div>
      </div>
      <div class="surebar"><i style="width:${pct}%"></i></div>
    </div>
    ${next ? `<div style="margin:-4px 0 16px"><button class="act" data-start="${next.s}.${next.u.n}">Memorise ${esc(next.u.name)} →</button></div>`
      : `<p class="sub" style="margin:-4px 0 16px">Every answer in this list is marked memorised. Switch subject or open all answers for a cold pass.</p>`}
    <div class="subchips">
      <button data-sub="all" class="${sureSub === "all" ? "on" : ""}">All subjects</button>
      ${subs.map((s) => `<button data-sub="${s}" class="${s === sureSub ? "on" : ""}">${SUBJ[s]} (${SURE.subjects[s].units.length})</button>`).join("")}
    </div>
    <div class="suretoggle">
      <button data-top="${sureAll ? 0 : 1}" class="${sureAll ? "" : "on"}">${sureAll ? "Show top 5 only" : "Show every unit"}</button>
      <button data-expand="${allOpen ? 0 : 1}">${allOpen ? "Collapse all answers" : "Open all answers"}</button>
      <span class="note">${sureAll ? "Every unit a paper has touched." : `Top 5 per subject — ${topShare}% of all past marks.`}</span>
    </div>
    ${groups.map((s) => {
      const sub = SURE.subjects[s];
      const exam = (typeof EXAMS !== "undefined" ? EXAMS.find((e) => e[0] === s) : null) || [];
      return `<div class="suregroup">
        <h2>${SUBJ[s]}</h2>
        <span>${sub.totalQ} past questions · ${sub.totalM} marks</span>
        ${exam[2] ? `<span class="paper">${exam[2]} · ${fmtDay(new Date(exam[1] + "T00:00:00"))}</span>` : ""}
      </div>
      <div class="surewrap">${shownUnits(s).map((u, i) => card(s, u, i)).join("")}</div>`;
    }).join("")}
    ${clusters.length ? `<details class="panel" style="margin-top:22px">
      <summary style="cursor:pointer;font-size:13.5px;font-weight:600">Came back word for word · ${clusters.length} clusters</summary>
      <p style="margin:10px 0 0;font-size:12.8px;color:var(--mut)">The same wording returned in different years. Each carries the full model answer and the order to write it in.</p>
      <div style="margin-top:12px">${clusters.map((c, i) => {
        const a = bestAns(c.ids);
        return `<div class="scard" data-cluster="${c.id}">
          <div class="top">
            <span class="rank">${String(i + 1).padStart(2, "0")}</span>
            <div style="flex:1;min-width:0">
              <h3>${esc(c.q)}</h3>
              <div class="meta2">
                <span class="sz">${c.count}× asked</span>
                <span>${SUBJ[c.s]}</span>
                <span>${c.marks} marks</span>
                <span>${c.years.length} papers</span>
                ${a && a.u ? `<span class="mchip">Unit ${a.u}</span>` : ""}
              </div>
            </div>
          </div>
          <div class="body">
            ${a ? `<p style="margin:0 0 10px;font-size:13px;color:var(--mut);line-height:1.6"><b style="color:var(--txt)">Why it repeats:</b> ${esc(a.logic)}<br><b style="color:var(--txt)">How to own it:</b> ${esc(a.how)}</p>` : ""}
            <div class="kithead" style="margin:12px 0 6px"><b>The exact wordings</b></div>
            <ul class="asklist">${c.ids.map((id) => {
              const q = window.QBANK.find((x) => x.id === id);
              return q ? `<li>${q.y} · ${q.marks || 5}m — ${esc(q.q)}</li>` : "";
            }).join("")}</ul>
            ${kitHTML(a, "Answer kit · " + c.count + "× question")}
          </div>
        </div>`;
      }).join("")}</div>
    </details>` : ""}`;

  view.querySelectorAll("[data-sub]").forEach((b) => b.addEventListener("click", () => { sureSub = b.dataset.sub; sureView(); }));
  view.querySelectorAll("[data-top]").forEach((b) => b.addEventListener("click", () => { sureAll = b.dataset.top === "1"; sureView(); }));
  view.querySelectorAll("[data-expand]").forEach((b) => b.addEventListener("click", () => {
    const open = b.dataset.expand === "1";
    for (const x of visible) {
      const k = x.s + "." + x.u.n;
      if (open) SURE_OPEN.add(k); else SURE_OPEN.delete(k);
    }
    sureView();
  }));
  view.querySelectorAll("[data-start]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.start;
    /* one answer on the desk at a time: opening the next closes the rest */
    for (const x of visible) SURE_OPEN.delete(x.s + "." + x.u.n);
    SURE_OPEN.add(k);
    sureView();
    const el = view.querySelector("#sure-" + k.replace(".", "-"));
    if (el) el.scrollIntoView({ block: "start", behavior: "smooth" });
  }));
  view.querySelectorAll("[data-open]").forEach((el) => el.addEventListener("click", () => {
    const k = el.dataset.open;
    const unit = el.closest(".sureunit");
    unit.classList.toggle("open");
    if (unit.classList.contains("open")) SURE_OPEN.add(k); else SURE_OPEN.delete(k);
  }));
  view.querySelectorAll("[data-reveal]").forEach((b) => b.addEventListener("click", () => {
    const a = view.querySelector(`[data-ans="${b.dataset.reveal}"]`);
    if (a) { a.classList.add("show"); b.textContent = "Marked answer shown"; }
  }));
  view.querySelectorAll("[data-say]").forEach((t) => {
    t.addEventListener("input", () => { SURE_SAID[t.dataset.say] = t.value; });
    t.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        const b = view.querySelector(`[data-check="${t.dataset.say}"]`);
        if (b) b.click();
      }
    });
  });
  view.querySelectorAll("[data-check]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.check;
    const t = view.querySelector(`[data-say="${k}"]`);
    const said = t ? t.value.trim() : "";
    SURE_SAID[k] = said;
    const r = sureCheck(k, said);
    SURE_LAST[k] = { cls: r.cls, html: r.html };
    if (r.pass) {
      SURE_MEM[k] = Date.now();
      saveSureMem();
      SURE_OPEN.add(k);
      const next = visible.find((x) => !SURE_MEM[x.s + "." + x.u.n]);
      if (next) {
        const nk = next.s + "." + next.u.n;
        SURE_LAST[k].html += `<div style="margin-top:10px"><button class="ghost" data-start="${nk}">Next: ${esc(next.u.name)} →</button></div>`;
      }
      sureView();
      const el = view.querySelector("#sure-" + k.replace(".", "-"));
      if (el) el.scrollIntoView({ block: "start", behavior: "smooth" });
    } else {
      const res = view.querySelector(`[data-res="${k}"]`);
      if (res) { res.hidden = false; res.className = r.cls; res.innerHTML = r.html; }
    }
  }));
  view.querySelectorAll("[data-mem]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.mem;
    if (SURE_MEM[k]) { delete SURE_MEM[k]; delete SURE_LAST[k]; }
    else SURE_MEM[k] = Date.now();
    saveSureMem();
    sureView();
  }));
  view.querySelectorAll("[data-cluster]").forEach((el) => el.addEventListener("click", (e) => {
    if (e.target.closest(".kit")) return;
    el.classList.toggle("open");
  }));
  wireKit(view);
}

/* =========================================================
   Subject map — a subject as one argument
   ========================================================= */
let mapSub = "se";

const SUBJ_THESIS = {
  se: "Software engineering is the discipline that keeps a large system changeable after its authors leave. The subject is one argument: choose a process that matches how wrong the requirements will be, turn wishes into testable requirements, model what you do not yet understand, settle the decisions that are expensive to reverse, cut the code along seams, test the risks you actually named, keep the running system alive, and manage the effort with a plan you keep measuring against reality. Each unit closes the gap the unit before it opened.",
  cdc: "A compiler is one sentence rewritten in six steps: characters become tokens, tokens are checked against a grammar and become a tree, the tree gets meaning and types, names get addresses, and the tree flattens into instructions a machine can run. Optimisation then removes work without changing the visible result. Real C and C++ compilers split the language-specific front end from a shared optimiser and back end, which is why a compiler course is one pipeline rather than ten topics.",
  egov: "E-government is not a website; it is the state's record moved online and made trustworthy. The chain runs from direction (who initiates, the state or the citizen), to how far a transaction may go, to the infrastructure that must lie underneath, to the security that keeps a record true and attributable, to the warehouse that makes ten years of records comparable, and finally to the diagnosis of a real deployment: which model, which maturity level, who lost discretion, and what limited it.",
  ncc: "One HTTP request is the whole subject. Kestrel accepts the message, middleware checks it in a fixed order, routing picks an endpoint, the action binds and validates a model, the database answers through EF Core, state decides what the next request remembers, the browser does what it can while the server re-checks all of it, security names who may pass, and deployment decides where the socket and the secrets live. Every unit is one checkpoint on that single path.",
  tw: "Technical writing is judged by what the reader can do afterwards. The subject walks one document from reader and purpose, through the writing process, into the short message, then the designed page and the screen, then the report, the resume, the talk and the recommendation that ends in a priced proposal — and closes on ethics: would a reader given only your page reach your conclusion? Each unit is the next thing a real document has to get right.",
  ecom: "E-commerce is a shop with no walls, held up by five layers that must all hold at once: a business model that says who pays whom, a payment that lets strangers transact safely, a store that records the order and proves the money arrived, a chain of custody that keeps it safe, and marketing that buys attention. SEO and recommendation then try to stop paying for every click, and the last unit makes you explain a real Nepali shop from the network up."
};

function mapView() {
  const sub = mapSub;
  const units = (window.CHAIN[sub] || []).slice();
  const logic = LOGIC[sub] || [];
  const isDone = (x) => !!SHOT.closed[sub + "." + x.n];
  const done = units.filter(isDone).length;
  view.innerHTML = `
    <h1>The whole subject, as one chain</h1>
    <p class="sub">Every unit answers the question the one before it left open. Read this once and ${SUBJ[sub]} stops being ${units.length} topics and becomes one argument — each card is then only the detail of one link.</p>
    <div class="msub">${EXAMS.map(([s]) => `<button class="${s === sub ? "on" : ""}" data-msub="${s}">${SUBJ[s]}</button>`).join("")}</div>
    <div class="mapthesis">
      <span class="wlab">${SUBJ[sub]} in one paragraph</span>
      <p>${esc(SUBJ_THESIS[sub] || "")}</p>
      <span class="mappace">${done}/${units.length} retired${done ? "" : " · nothing touched yet"}</span>
    </div>
    <ol class="maplist">
      ${units.map((x) => {
        const u = logic.find((y) => y.n === x.n) || {};
        return `<li class="maprow${isDone(x) ? " done" : ""}">
          <a class="mapname" href="#shot-${sub}-${x.n}"><span class="mapn">${x.n}</span><b>${esc(x.name)}</b>${isDone(x) ? "<i>retired</i>" : ""}</a>
          <p class="mapone">${esc(u.oneLiner || "")}</p>
          ${x.to ? `<p class="mapto"><span>leaves open</span>${esc(x.to)}</p>` : ""}
        </li>`;
      }).join("")}
    </ol>
    <p class="mapcta">${units.length ? `Start at the top: <a href="#shot-${sub}-${units[0].n}">open unit 1 as a card \u2192</a>` : ""}</p>`;
  view.querySelectorAll("[data-msub]").forEach((b) => b.addEventListener("click", () => {
    mapSub = b.dataset.msub;
    try { history.replaceState(null, "", location.pathname + location.search + "#map-" + mapSub); } catch (e) {}
    mapView();
    window.scrollTo(0, 0);
  }));
}

/* =========================================================
   boot
   ========================================================= */
function render() {
  try { if (route.view !== "why" && "speechSynthesis" in window) window.speechSynthesis.cancel(); } catch (e) {}
  whyPlay.on = false;
  if (route.view === "topics") topicsView();
  else if (route.view === "topic") topicView();
  else if (route.view === "why") whyView();
  else if (route.view === "shot") shotView();
  else if (route.view === "map") mapView();
  else if (route.view === "sure") sureView();
  else if (route.view === "labs") labsView();
  else if (route.view === "drill") drillView();
  else progressView();
}
function routeHash(raw) {
  const hash = String(raw || "").replace(/^#/, "");
  const lab = LABS.find((l) => l.id === hash);
  const tm = /^topic-([a-z]+)-(\d+)$/.exec(hash);
  const wm = /^why-([a-z]+)(?:-(\d+))?$/.exec(hash);
  const sm = /^shot(?:-([a-z]+)-(\d+))?$/.exec(hash);
  const um = /^sure-([a-z]+)-(\d+)$/.exec(hash);
  const mm = /^map(?:-([a-z]+))?$/.exec(hash);
  if (lab) lab.run();
  else if (tm) { topicSub = tm[1]; openTopic(tm[1], Number(tm[2])); }
  else if (wm) openWhy(wm[1], wm[2] ? Number(wm[2]) : null);
  else if (sm) openShot(sm[1] || null, sm[2] ? Number(sm[2]) : null);
  else if (um) {
    const ss = um[1], nn = Number(um[2]);
    const sub = (((window.SURE || {}).subjects || {})[ss]) || null;
    const idx = sub ? sub.units.findIndex((u) => u.n === nn) : -1;
    sureSub = ss;
    sureAll = idx >= 5;
    SURE_OPEN.add(ss + "." + nn);
    go("sure");
    requestAnimationFrame(() => {
      const el = document.getElementById("sure-" + ss + "-" + nn);
      if (el) el.scrollIntoView({ block: "start" });
    });
  }
  else if (mm) {
    mapSub = mm[1] || "se";
    go("map");
    try { history.replaceState(null, "", location.pathname + location.search + "#map-" + mapSub); } catch (e) {}
  }
  else if (hash === "drill" || hash === "progress" || hash === "topics" || hash === "sure" || hash === "labs" || hash === "why") go(hash);
  else render();
}
routeHash(location.hash);
/* back/forward and any in-page hash link must re-route too; go() uses replaceState, so this cannot loop */
window.addEventListener("hashchange", () => routeHash(location.hash));
</script>
