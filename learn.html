<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CSIT 6 · Learn</title>
<script>
  try { var t = localStorage.getItem("csit6.theme");
    if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
</script>
<style>
  :root{
    --bg:#0a0c10;--panel:#11141a;--panel2:#161a22;--line:#232936;
    --txt:#e7eaf0;--mut:#9aa3b6;--dim:#697389;
    --acc:#6ee7b7;--warn:#fbbf24;--bad:#f87171;--info:#7dd3fc;
    --code:#0d1117;--on:#06231a;--shadow:none;--gl:#39414f;
  }
  html[data-theme="light"]{
    --bg:#f7f8f5;--panel:#fff;--panel2:#f1f4ec;--line:#e0e5da;
    --txt:#151a17;--mut:#4f5a6d;--dim:#8b93a1;
    --acc:#0e8f63;--warn:#a16207;--bad:#b91c1c;--info:#0369a1;
    --code:#f2f4ee;--on:#fff;--shadow:0 1px 2px rgba(20,30,22,.05),0 8px 24px -16px rgba(20,30,22,.25);--gl:#b2bda6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    zoom:1.08;   /* one notch larger — most text sets its own px size, so the base alone would not move it */
    -webkit-font-smoothing:antialiased}
  a{color:var(--acc)}
  .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;
    padding:12px 22px;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
  .brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
  .brand b{color:var(--acc)}
  nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
  nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:13.5px;
    padding:6px 11px;border-radius:8px;cursor:pointer}
  nav button:hover{color:var(--txt);background:var(--panel2)}
  nav button.on{color:var(--txt);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--acc)}
  .spacer{flex:1}
  .link{font-size:12.5px;color:var(--mut);text-decoration:none;border:1px solid var(--line);
    padding:6px 11px;border-radius:8px}
  .link:hover{color:var(--txt);border-color:var(--acc)}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 90px}
  h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--mut);font-size:14px;margin:0 0 24px}

  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
    cursor:pointer;transition:border-color .18s,transform .18s;box-shadow:var(--shadow)}
  .card:hover{border-color:var(--acc);transform:translateY(-2px)}
  .card .tag{font:600 10.5px/1 ui-monospace,monospace;letter-spacing:.1em;color:var(--dim);
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;display:inline-block}
  .card h3{margin:11px 0 6px;font-size:16.5px;letter-spacing:-.01em}
  .card p{margin:0;color:var(--mut);font-size:13.3px;line-height:1.5}
  .card .go{margin-top:12px;font-size:12px;color:var(--acc)}

  /* lab shell */
  .labhead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .back{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:8px;
    padding:6px 11px;font-size:12.5px;cursor:pointer}
  .back:hover{color:var(--txt);border-color:var(--acc)}
  .labtitle{font-size:17px;font-weight:600}
  .labtitle small{display:block;font-size:11.5px;color:var(--dim);font-weight:400;letter-spacing:.04em}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.wide{flex:1 1 100%;min-width:0}
  .field.wide input{width:100%}
  .field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  input[type=text],input[type=number],select{background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px;outline:none;min-width:120px}
  input:focus,select:focus{border-color:var(--acc)}
  button.act{background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:9px 15px;
    font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
  button.act:hover{filter:brightness(1.07)}
  button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:8px;
    padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}
  button.ghost:hover{color:var(--txt);border-color:var(--acc)}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  code{background:var(--code);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.9em}
  pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:13px 15px;
    overflow:auto;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
  th,td{border:1px solid var(--line);padding:6px 9px;text-align:left}
  th{background:var(--panel2);font-weight:600;font-size:12px}
  .err{color:var(--bad);font-size:13px}

  /* graph */
  .graph{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--code);padding:6px}
  svg{display:block}
  .node circle{fill:var(--panel);stroke:var(--gl);stroke-width:1.6}
  .node.accept circle{fill:none;stroke:var(--acc)}
  .node.accept circle:first-child{fill:var(--panel);stroke:var(--gl)}
  .node.start circle:first-child{stroke:var(--acc);stroke-width:2}
  .node text{fill:var(--txt);font:11px ui-monospace,monospace;text-anchor:middle}
  .edge{fill:none;stroke:var(--mut);stroke-width:1.4;opacity:.85}
  .edge.eps{stroke-dasharray:4 3;opacity:.6}
  .elabel{fill:var(--mut);font:10.5px ui-monospace,monospace;text-anchor:middle;paint-order:stroke;
    stroke:var(--code);stroke-width:4px;stroke-linejoin:round}
  .arrow{fill:var(--mut);opacity:.85}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--dim)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend .dot{width:9px;height:9px;border-radius:50%;border:1.6px solid var(--gl);display:inline-block}
  .legend .dot.acc{border:2.4px solid var(--acc)}
  .legend .dot.eps{border:1.5px dashed var(--mut);border-radius:50%}
  .legend .dot.start{border-color:var(--acc)}

  /* pipeline */
  .pipe{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .stage{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;
    padding:10px 13px;background:var(--panel2);transition:.25s}
  .stage .no{font:11px ui-monospace,monospace;color:var(--dim);min-width:18px}
  .stage .name{font-size:13.5px;font-weight:600;min-width:150px}
  .stage .desc{font-size:12.5px;color:var(--mut)}
  .stage.pass{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
  .stage.stop{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--panel2))}
  .stage.skip{opacity:.35}
  .stage.now{box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 45%,transparent)}
  .log{font:12.5px/1.7 ui-monospace,monospace;color:var(--mut);max-height:170px;overflow:auto;
    white-space:pre-wrap;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:12px}

  /* why it works */
  .whytools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 16px}
  .whytools .hint{font-size:11.5px;color:var(--dim);margin-left:auto}
  .why{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
    margin-bottom:12px;box-shadow:var(--shadow);transition:border-color .2s;scroll-margin-top:76px}
  .why.open{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
  .why.playing{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 22%,transparent)}
  .whyhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .whyhead h3{margin:0;font-size:15px;letter-spacing:-.01em}
  .wtag{font:600 10px/1 ui-monospace,monospace;letter-spacing:.1em;color:var(--dim);
    background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
  .wheat{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}
  .wone{margin:10px 0 0;font-size:17.5px;line-height:1.45;letter-spacing:-.01em;color:var(--txt)}
  .wone::before{content:"“";color:var(--acc);font-weight:700}
  .wone::after{content:"”";color:var(--acc);font-weight:700}
  .wflow{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;margin:9px 0 0}
  .wflow span{font:600 10.8px/1.45 ui-monospace,monospace;color:var(--txt);
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
  .wflow i{color:var(--dim);font-style:normal;font-size:10px}
  @media (max-width:560px){.wflow span{font-size:10.2px}}
  .wbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .wbody{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
  .wsec{margin:0 0 13px}
  .wlab{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .wsec p{margin:0;font-size:14px;line-height:1.65;color:var(--mut)}
  .wstory{border-left:3px solid var(--acc);background:var(--panel2);border-radius:0 10px 10px 0;
    padding:12px 15px;margin:0 0 14px;font-size:14.5px;line-height:1.7;color:var(--txt)}
  .widea{margin:11px 0 0;padding:11px 14px;border-radius:9px;background:var(--panel2);
    border:1px solid var(--line)}
  .widea > b{display:block;font:600 9.5px/1 ui-monospace,monospace;letter-spacing:.13em;
    text-transform:uppercase;color:var(--acc);margin-bottom:5px}
  .widea p{margin:0;font-size:14px;line-height:1.68;color:var(--txt)}
  .wsteps{margin:0 0 14px;padding:0;list-style:none;counter-reset:ws}
  .wsteps li{counter-increment:ws;display:flex;gap:11px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .wsteps li:last-child{border-bottom:0}
  .wsteps li::before{content:counter(ws);font:600 11px/1 ui-monospace,monospace;color:var(--acc);
    border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:50%;
    width:20px;height:20px;display:grid;place-items:center;flex:none;margin-top:2px}
  .wsteps b{display:block;font-size:13.5px;color:var(--txt);font-weight:600}
  .wsteps span{font-size:13px;color:var(--mut);line-height:1.55}
  .wstory{margin:12px 0 0;padding:10px 13px;background:var(--panel2);
    border-left:2px solid color-mix(in srgb,var(--acc) 60%,var(--line));border-radius:0 9px 9px 0}
  .wstory b,.wtrap b,.wguide b{display:block;font:600 9.5px/1 ui-monospace,monospace;
    letter-spacing:.13em;text-transform:uppercase;margin-bottom:4px}
  .wstory b{color:var(--acc)}
  .wstory p{margin:0;font-size:13px;line-height:1.65;color:var(--mut)}
  .wtrap{margin:12px 0 0;padding:9px 13px;font-size:12.8px;line-height:1.6;color:var(--mut);
    background:color-mix(in srgb,var(--warn) 9%,transparent);
    border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line));border-radius:9px}
  .wtrap b{color:var(--warn)}
  .wtrap ol{margin:2px 0 0;padding-left:17px}
  .wtrap li{margin:3px 0}
  .wtrap li::marker{color:color-mix(in srgb,var(--warn) 70%,var(--dim))}
  .wkeys{margin:12px 0 0;padding:10px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:9px}
  .wkeys > b{display:block;font:600 9.5px/1 ui-monospace,monospace;letter-spacing:.13em;
    text-transform:uppercase;color:var(--acc);margin-bottom:6px}
  .wkeys dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
  .wkeys dt{font-size:12.2px;font-weight:600;color:var(--txt);line-height:1.45}
  .wkeys dd{margin:0;font-size:12.2px;color:var(--mut);line-height:1.5}
  @media (max-width:560px){.wkeys dl{grid-template-columns:1fr;gap:1px 0}
    .wkeys dd{margin:0 0 5px}}
  .wfacts{margin:12px 0 0;padding:10px 13px;border-radius:9px;
    background:color-mix(in srgb,var(--acc) 6%,var(--panel2));border:1px solid var(--acc-line)}
  .wfacts > b{display:block;font:600 9.5px/1 ui-monospace,monospace;letter-spacing:.13em;
    text-transform:uppercase;color:var(--acc);margin-bottom:6px}
  .wformula{margin:0 0 7px;font:12.4px/1.5 ui-monospace,monospace;color:var(--txt)}
  .wfacts table{width:100%;border-collapse:collapse;margin:0 0 7px}
  .wfacts td{padding:3px 0;font-size:12.4px;line-height:1.45;color:var(--mut);
    border-top:1px solid var(--line);vertical-align:top}
  .wfacts td:first-child{width:34%;color:var(--txt);font-weight:600;padding-right:10px}
  .wworked{margin:0;font-size:12.4px;line-height:1.55;color:var(--mut)}
  .wdraw{margin:12px 0 0;padding:10px 13px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
  .wdraw > b{display:block;font:600 9.5px/1 ui-monospace,monospace;letter-spacing:.13em;
    text-transform:uppercase;color:var(--acc);margin-bottom:6px}
  .wdraw pre{margin:0 0 7px;padding:9px 10px;border-radius:7px;background:var(--bg);
    border:1px solid var(--line);overflow-x:auto;font:11.5px/1.65 ui-monospace,monospace;
    color:var(--txt);white-space:pre}
  .wdraw p{margin:0;font-size:12.4px;line-height:1.55;color:var(--mut)}
  .wguide{margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--line);
    font-size:12.8px;line-height:1.65;color:var(--mut)}
  .wguide b{color:var(--dim)}
  .wpress{margin:11px 0 4px;font-size:13px;line-height:1.65;color:var(--mut);
    padding:0 0 0 11px;border-left:2px solid color-mix(in srgb,var(--bad) 45%,var(--line))}
  .wpress b{display:block;font:600 9.5px/1 ui-monospace,monospace;letter-spacing:.13em;
    text-transform:uppercase;color:color-mix(in srgb,var(--bad) 80%,var(--txt));margin-bottom:3px}
  .wunlock{display:block;margin:9px 0 0;font-size:11.5px;line-height:1.55;color:var(--dim);
    padding-left:10px;border-left:2px solid var(--line)}
  .wlab-link{display:block;margin:10px 0 2px;padding:9px 12px;border-radius:9px;text-decoration:none;
    background:color-mix(in srgb,var(--acc) 7%,transparent);border:1px dashed var(--acc-line)}
  .wlab-link b{display:block;font:600 9.5px/1 ui-monospace,monospace;letter-spacing:.13em;
    text-transform:uppercase;color:var(--acc);margin-bottom:4px}
  .wlab-link span{font-size:12.5px;line-height:1.55;color:var(--mut)}
  .wlab-link:hover span{color:var(--txt)}
  .shotask.aftergate{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .gate [data-ga]:disabled{opacity:.45;cursor:not-allowed}
  .wexam{background:color-mix(in srgb,var(--acc) 8%,transparent);border:1px solid var(--acc-line);
    border-radius:10px;padding:11px 13px}
  .wexam p{margin:0;font-size:13.5px;color:var(--txt);line-height:1.6}
  @media (max-width:560px){
    .why{padding:15px 15px;scroll-margin-top:104px}
    .wone{font-size:16.5px}
    .wheat{margin-left:0;flex-basis:100%}
  }

  /* one shot */
  .shotstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 12px}
  .shotstats .s{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .shotstats .s b{display:block;font-size:21px;letter-spacing:-.02em;line-height:1.2}
  .shotstats .s span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .shotstats .s i{display:block;font-size:11.5px;color:var(--mut);font-style:normal;margin-top:3px}
  .paperstrip{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
  .pchip{display:flex;flex-direction:column;gap:1px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:7px 10px;font-size:11.5px;color:var(--mut);min-width:104px}
  .pchip b{font-size:11.5px;color:var(--txt);font-weight:600}
  .pchip em{font-style:normal;color:var(--dim);font-size:10.5px}
  .pchip.done{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
  .pchip.near{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
  .shotbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 18px}
  .shotbar i{display:block;height:100%;background:var(--acc);transition:width .35s}
  .shot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
    margin-bottom:12px;box-shadow:var(--shadow);scroll-margin-top:76px}
  .shot.leaving{opacity:0;transform:translateX(18px);transition:opacity .3s,transform .3s}
  .shothead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .shothead h3{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .schip{font:600 10px/1 ui-monospace,monospace;letter-spacing:.08em;color:var(--acc);
    background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));
    border-radius:5px;padding:4px 6px}
  .chainin,.chainout{margin:11px 0 0;padding:9px 12px;border-radius:9px;background:var(--panel2);
    border-left:2px solid color-mix(in srgb,var(--acc) 55%,var(--line));font-size:13px;line-height:1.55;color:var(--mut)}
  .chainout{border-left-color:var(--line);margin-top:12px}
  .chainin b,.chainout b{color:var(--dim);font:600 9.5px/1 ui-monospace,monospace;letter-spacing:.13em;
    text-transform:uppercase;display:block;margin-bottom:3px}
  .shotfoot{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;margin:11px 0 0;font-size:12px}
  .shotfoot a{color:var(--acc);text-decoration:none}
  .shotfoot a:hover{text-decoration:underline}
  .shotfoot span{margin-left:auto;color:var(--dim);font-size:11px}
  .shot .wsteps{margin:13px 0 0}
  .shot .wsteps li{padding:6px 0}
  .shotask{margin:14px 0 0;padding-top:13px;border-top:1px dashed var(--line)}
  .shotask ul{margin:5px 0 9px;padding-left:17px}
  .shotask li{font-size:13px;line-height:1.55;color:var(--mut);margin-bottom:5px}
  .shotask li b{color:var(--acc);font:600 10.5px/1 ui-monospace,monospace;margin-right:5px}
  .shotask li em{display:inline-block;margin-left:7px;font-style:normal;font-size:10.5px;
    color:var(--dim);white-space:nowrap}
  .qcover{margin:0 0 10px;font-size:12.5px;line-height:1.55;color:var(--dim)}
  .qcover b{color:var(--txt)}
  .qskel{margin:0 0 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
  .qskel > summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;padding:8px 11px;
    font-size:12.8px;line-height:1.5;color:var(--mut);list-style:none}
  .qskel > summary::-webkit-details-marker{display:none}
  .qskel > summary b{flex:none;color:var(--acc);font:600 10.5px/1.5 ui-monospace,monospace}
  .qskel > summary span{flex:1;min-width:0}
  .qskel > summary em{flex:none;font-style:normal;font-size:10.5px;color:var(--dim);white-space:nowrap}
  .qskel[open] > summary{color:var(--txt);border-bottom:1px solid var(--line)}
  .qskel ol{margin:7px 0 8px;padding-left:28px}
  .qskel li{font-size:12.5px;line-height:1.55;color:var(--mut);margin-bottom:3px}
  .qfull{display:inline-block;margin:0 11px 9px;font-size:11.5px;color:var(--acc);text-decoration:none}
  @media (max-width:560px){.qskel > summary{flex-wrap:wrap}
    .qskel > summary em{width:100%;margin-left:0}}
  .gate{margin:15px 0 0;padding:14px;border-radius:11px;background:color-mix(in srgb,var(--acc) 5%,var(--panel2));
    border:1px solid var(--line)}
  .gate .gatehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .gateq{margin:11px 0 0;font-size:14.5px;line-height:1.55;color:var(--txt);font-weight:500}
  .gatea{margin:9px 0 0;font-size:13.5px;line-height:1.65;color:var(--mut);
    border-left:2px solid var(--acc);padding-left:11px}
  .ticks{margin:13px 0 0;display:grid;gap:6px}
  .ticks label{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--mut);cursor:pointer;
    line-height:1.45;padding:2px 0}
  .ticks input{accent-color:var(--acc);width:15px;height:15px;margin-top:2px;flex:none;cursor:pointer}
  .gate textarea{width:100%;margin:9px 0 7px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;color:var(--txt);font:inherit;font-size:13.5px;line-height:1.55;
    resize:vertical;outline:none;min-height:64px}
  .gate textarea:focus{border-color:var(--acc)}
  .gateres{margin:9px 0 0;font-size:12.8px;line-height:1.6;color:var(--mut)}
  .gateres b{color:var(--txt)}
  .gateres.pass{color:var(--acc)}
  .gateres .miss{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:5px;
    padding:1px 6px;margin:3px 4px 0 0;font:11px ui-monospace,monospace;color:var(--dim)}
  .gatebtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .gatebtns .act:disabled{opacity:.42;cursor:not-allowed}
  .rowlist{margin:0;padding:0;list-style:none}
  .rowlist li{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .rowlist li:last-child{border-bottom:0}
  .rowlist .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
  .rowlist li.closed .dot{background:var(--acc)}
  .rowlist li.closed span.nm{color:var(--dim);text-decoration:line-through}
  .rowlist span.nm{flex:1;min-width:0;color:var(--txt)}
  .rowlist em{font-style:normal;color:var(--dim);font-size:11px;white-space:nowrap}
  .rowlist button{font-size:11px;padding:2px 7px}
  .warm{margin:0 0 16px}
  .warmrow{padding:9px 0;border-top:1px dashed var(--line)}
  .warmrow:first-of-type{border-top:0;padding-top:2px}
  .warmtop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .warmnm{flex:1;min-width:0;font-size:13.5px;color:var(--txt)}
  .warm .gateq{margin:9px 0 0;font-size:14px}
  .warm .gatea{margin:8px 0 0;font-size:13px}
  .warm .gatebtns{margin-top:9px}
  .keepin{width:100%;margin:0 0 4px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;color:var(--txt);font:inherit;font-size:13.5px}
  .keepin:focus{outline:0;border-color:var(--acc)}
  .keepmsg{font-size:11.5px;color:var(--acc)}
  .lines .linesub{margin-bottom:12px}
  .lines ol{margin:0;padding:0;list-style:none}
  .lines li{display:flex;gap:9px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.8px;line-height:1.55}
  .lines li:last-child{border-bottom:0}
  .lines .ln{font:600 10.5px/1.7 ui-monospace,monospace;color:var(--dim);flex:none;width:16px}
  .lines .lbody{flex:1;min-width:0}
  .lines .lt{display:block;color:var(--txt)}
  .lines .lp{display:block;margin-top:1px;font-size:11.5px;line-height:1.5;color:var(--dim)}
  .lines li.empty .lt{color:var(--dim);font-style:italic}
  .lines li.empty .lp{display:none}
  .lines #copyLines{margin-top:4px}
  .protocol{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin:0 0 16px;padding:11px 14px;
    background:var(--panel2);border:1px solid var(--line);border-radius:11px}
  .protocol .pk{font:600 9.5px/1.6 ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase;
    color:var(--acc);flex:none;max-width:86px}
  .protocol ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:1;min-width:0}
  .protocol li{font-size:12px;line-height:1.5;color:var(--mut);counter-increment:pr}
  .protocol li::before{content:counter(pr);display:inline-grid;place-items:center;width:15px;height:15px;
    margin-right:5px;border:1px solid var(--line);border-radius:50%;font:600 9.5px/1 ui-monospace,monospace;
    color:var(--acc);vertical-align:1px}
  .protocol b{color:var(--txt);font-weight:600}
  .protocol .pcost{flex-basis:100%;font-size:11.5px;color:var(--dim);margin-top:-2px}
  .firstrun{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;
    margin:0 0 16px;padding:13px 15px;border-radius:11px;
    background:color-mix(in srgb,var(--acc) 9%,transparent);border:1px solid var(--acc-line)}
  .firstrun b{display:block;font-size:13.5px;color:var(--txt);margin-bottom:3px}
  .firstrun span{font-size:12.5px;line-height:1.55;color:var(--mut);max-width:72ch;display:block}
  .firstrun button{flex:none}
  @media (max-width:560px){.firstrun{gap:10px}.firstrun button{width:100%}}
  .msub{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px}
  .msub button{font:inherit;font-size:12.5px;color:var(--mut);background:var(--panel2);
    border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
  .msub button.on{color:var(--acc);border-color:var(--acc-line);
    background:color-mix(in srgb,var(--acc) 10%,transparent)}
  .mapthesis{margin:0 0 18px;padding:14px 16px;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}
  .mapthesis p{margin:0;font-size:14.5px;line-height:1.7;color:var(--txt)}
  .mappace{display:block;margin-top:7px;font:11px ui-monospace,monospace;color:var(--dim)}
  .maplist{list-style:none;margin:0;padding:0}
  .maprow{position:relative;padding:0 0 16px 22px;border-left:1px solid var(--line);margin-left:9px}
  .maprow:last-child{border-left-color:transparent;padding-bottom:4px}
  .maprow::before{content:"";position:absolute;left:-5px;top:6px;width:9px;height:9px;border-radius:50%;
    background:var(--panel);border:2px solid var(--dim)}
  .maprow.done::before{border-color:var(--good);background:var(--good)}
  .mapname{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--txt)}
  .mapname b{font-size:14.5px}
  .mapname .mapn{font:600 11px ui-monospace,monospace;color:var(--acc)}
  .mapname i{font-style:normal;font-size:10.5px;color:var(--good)}
  .mapone{margin:4px 0 0;font-size:13px;line-height:1.6;color:var(--mut)}
  .mapto{margin:7px 0 0;font-size:12.5px;line-height:1.55;color:var(--dim)}
  .mapto span{display:block;font:600 9px ui-monospace,monospace;letter-spacing:.13em;
    text-transform:uppercase;color:var(--acc);margin-bottom:2px}
  .mapcta{margin:6px 0 0;font-size:13px;color:var(--mut)}
  .maplink{margin:9px 0 0;font-size:13px}
  @media (max-width:820px){.protocol ol{grid-template-columns:1fr 1fr}}
  @media (max-width:560px){.protocol ol{grid-template-columns:1fr}}
  @media (max-width:720px){
    .shotstats{grid-template-columns:1fr 1fr}
    .shot{padding:15px 15px;scroll-margin-top:104px}
    .gatebtns .hint{display:none}
    .shotfoot span{margin-left:0}
  }

  /* drill */
  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
  .qmeta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:11px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;padding:3px 8px}
  .qtext{font-size:18px;line-height:1.55;margin:0 0 6px;letter-spacing:-.01em}
  .hintline{font-size:13px;color:var(--mut);margin-top:14px}
  .rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
  .rate button{padding:11px 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
    color:var(--txt);font:inherit;font-size:13px;cursor:pointer;line-height:1.35}
  .rate button b{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:2px}
  .rate button:hover{border-color:var(--acc)}
  .rate button[data-k=again]:hover{border-color:var(--bad)}
  .progress{height:4px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .progress i{display:block;height:100%;background:var(--acc);transition:width .3s}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
  .stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:9px}
  .bar i{display:block;height:100%;background:var(--acc)}
  .empty{color:var(--dim);text-align:center;padding:50px 0;font-size:14px}

  /* ---------- topics ---------- */
  .subchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .subchips button{background:var(--panel);border:1px solid var(--line);color:var(--mut);
    font:inherit;font-size:12.5px;padding:6px 11px;border-radius:99px;cursor:pointer}
  .subchips button:hover{color:var(--txt);border-color:var(--acc)}
  .subchips button.on{color:var(--on);background:var(--acc);border-color:var(--acc);font-weight:600}
  .unitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .ucard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 16px;
    cursor:pointer;transition:border-color .16s,transform .16s;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .ucard:hover{border-color:var(--acc);transform:translateY(-2px)}
  .ucard .un{font:600 10.5px/1 ui-monospace,monospace;color:var(--dim);letter-spacing:.12em}
  .ucard h3{margin:7px 0 6px;font-size:15px;letter-spacing:-.01em;line-height:1.35}
  .ucard .heatline{font-size:11.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .ucard .heatline b{color:var(--acc);font-weight:600}
  .ubar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);opacity:var(--o,.25)}

  /* stepper */
  .stepper{margin:6px 0 0}
  .step{display:flex;gap:12px;padding:0;border-bottom:1px solid transparent;opacity:0;
    max-height:0;overflow:hidden;transition:opacity .3s ease,max-height .35s ease}
  .step.show{opacity:1;max-height:320px;padding:12px 0;border-bottom-color:var(--line)}
  .step .sn{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font:600 11px ui-monospace,monospace;color:var(--mut)}
  .step.show .sn{border-color:var(--acc);color:var(--acc)}
  .step b{display:block;font-size:13.5px;margin-bottom:2px}
  .step p{margin:0;font-size:13px;color:var(--mut);line-height:1.55}
  .stepctl{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .dots{display:flex;gap:4px;margin-left:auto}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--acc)}

  /* flip cards */
  .flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-top:10px}
  .flip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    cursor:pointer;min-height:64px;transition:border-color .16s,background .16s}
  .flip:hover{border-color:var(--acc)}
  .flip .k{font-size:12.5px;font-weight:600;display:block}
  .flip .v{font-size:12.5px;color:var(--mut);display:none;margin-top:6px;line-height:1.5}
  .flip.open .v{display:block}
  .flip.open{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--panel2))}
  .flip .tap{font-size:10.5px;color:var(--dim);margin-top:4px;display:block}
  .flip.open .tap{display:none}

  .traps{margin:8px 0 0;padding-left:0;list-style:none}
  .traps li{padding:7px 0 7px 22px;position:relative;font-size:13px;color:var(--mut);line-height:1.5;
    border-bottom:1px dashed var(--line)}
  .traps li::before{content:"✕";position:absolute;left:2px;top:6px;color:var(--warn);font-size:11px;font-weight:700}
  .asklist{margin:8px 0 0;padding-left:0;list-style:none;counter-reset:a}
  .asklist li{padding:6px 0 6px 24px;position:relative;font-size:13px;color:var(--mut);counter-increment:a}
  .asklist li::before{content:counter(a);position:absolute;left:0;top:6px;color:var(--dim);font:600 10.5px ui-monospace,monospace}
  .asklist li::after{content:"";}

  /* answer kit */
  .kit{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:14px;margin-top:10px}
  .kithead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .kithead b{font-size:12.5px;letter-spacing:.02em}
  .kitbar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 12px}
  .kitbar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
  .kmeta{display:flex;justify-content:space-between;gap:10px;margin:-6px 0 10px;
    font:11px/1.4 ui-monospace,SFMono-Regular,monospace;color:var(--dim)}
  .pt{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:13px;color:var(--mut);
    border-bottom:1px dashed var(--line);line-height:1.5}
  .pt.hidden{opacity:.35;filter:blur(3.5px);user-select:none}
  .pt.hidden .txt{color:transparent;text-shadow:0 0 8px var(--mut)}
  .pt .tick{flex:0 0 18px;height:18px;border-radius:5px;border:1px solid var(--line);background:var(--panel);
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;margin-top:1px}
  .pt.hit .tick{background:var(--acc);border-color:var(--acc);color:var(--on)}
  .ansblock{white-space:pre-wrap;font-size:13.5px;line-height:1.75;background:var(--code);
    border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-top:10px;display:none}
  .ansblock.show{display:block}

  /* question hint (hover) */
  .qwrap{position:relative}
  .qtext{cursor:help;position:relative;display:inline}
  .qtext:focus{outline:none}
  .hintpop{position:absolute;left:0;top:calc(100% + 8px);z-index:20;width:min(520px,88vw);
    background:var(--panel);border:1px solid var(--acc);border-radius:12px;padding:13px 15px;
    box-shadow:0 18px 40px -20px rgba(0,0,0,.6);opacity:0;pointer-events:none;transform:translateY(-4px);
    transition:opacity .18s,transform .18s;text-align:left}
  .qwrap:hover .hintpop,.qwrap:focus-within .hintpop,.qwrap.pinned .hintpop{opacity:1;pointer-events:auto;transform:none}
  .hintpop .hl{font:600 10px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);display:block;margin-bottom:4px}
  .hintpop p{margin:0 0 10px;font-size:12.8px;line-height:1.55;color:var(--mut)}
  .hintpop p:last-child{margin-bottom:0}
  .hintbtn{background:none;border:0;color:var(--dim);font:inherit;font-size:11.5px;cursor:pointer;
    padding:2px 0;text-decoration:underline dotted;text-underline-offset:3px}
  .hintbtn:hover{color:var(--acc)}
  .logicbtn{background:none;border:1px solid var(--line);border-radius:6px;color:var(--mut);
    font:600 11px/1 ui-monospace,monospace;padding:5px 8px;cursor:pointer;white-space:nowrap;
    transition:color .15s,border-color .15s,background .15s}
  .logicbtn:hover{color:var(--acc);border-color:var(--acc);background:var(--acc-weak)}
  .logicmodal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;
    background:rgba(6,8,12,.66);backdrop-filter:blur(5px)}
  .logicmodal[hidden]{display:none}
  .logicbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:16px 16px 13px;
    box-shadow:0 26px 80px rgba(0,0,0,.5)}
  .logichead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
  .logichead h3{margin:0;font-size:15px;line-height:1.3}
  .logichead .cap{font:600 10px/1.4 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
  .logicx{background:none;border:0;color:var(--dim);font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
  .logicx:hover{color:var(--txt)}
  .logicq{font-size:12.8px;line-height:1.55;color:var(--mut);margin:0 0 10px}
  .logicstage{position:relative;min-height:176px;border:1px solid var(--line);border-radius:12px;
    background:var(--panel2);padding:16px;overflow:hidden}
  .logicstep .num{font:600 10px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
  .logicstep h4{margin:9px 0 7px;font-size:16px;line-height:1.3}
  .logicstep p{margin:0;font-size:13.2px;line-height:1.65;color:var(--mut)}
  .logicstep.in{animation:logicIn .42s ease both}
  @keyframes logicIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .logicdots{display:flex;gap:5px;margin:11px 0 0}
  .logicdots i{height:3px;flex:1;border-radius:2px;background:var(--line);transition:background .2s}
  .logicdots i.on{background:var(--acc)}
  .logicctl{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .logicctl .cap{font:11px ui-monospace,monospace;color:var(--dim);margin-left:auto}
  .logicnote{margin:11px 0 0;font-size:12.4px;line-height:1.6;color:var(--mut)}
  .logicnote b{color:var(--txt)}
  /* the video pane inside the same reel */
  .logicseg{display:flex;gap:4px;margin:0 0 12px;padding:3px;background:var(--panel2);
    border:1px solid var(--line);border-radius:9px;width:max-content}
  .logicseg button{background:none;border:0;border-radius:6px;color:var(--mut);cursor:pointer;
    font:600 11px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;padding:7px 13px}
  .logicseg button[aria-selected="true"]{background:var(--panel);color:var(--txt)}
  .vidlist{display:grid;gap:8px}
  .vidrow{display:flex;gap:11px;align-items:center;text-align:left;width:100%;font:inherit;
    cursor:pointer;text-decoration:none;color:inherit;
    border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--panel2);
    transition:border-color .15s,background .15s}
  .vidrow:hover,.vidrow:focus-visible{border-color:var(--acc);background:var(--acc-weak);outline:none}
  .vglyph{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:8px;
    background:var(--acc);color:#fff;font-size:11px}
  .vidrow b{display:block;font-size:13px;line-height:1.4;font-weight:600}
  .vidrow .vm{display:block;font:11px ui-monospace,monospace;color:var(--dim);margin-top:3px}
  /* the clip plays here, inside the reel — the iframe exists only after a tap */
  .vidhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin:0 0 8px}
  .vidhead b{font-size:13px;line-height:1.45;font-weight:600}
  .vidback{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:7px;
    color:var(--mut);cursor:pointer;font:600 11px/1 ui-monospace,monospace;padding:6px 9px}
  .vidback:hover{color:var(--txt);border-color:var(--acc)}
  .vidframe{position:relative;aspect-ratio:16/9;border-radius:11px;overflow:hidden;
    background:#000;border:1px solid var(--line)}
  .vidframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .vidopen{display:inline-block;margin-top:8px;font-size:12px;color:var(--acc);
    text-decoration:none;border-bottom:1px dotted var(--acc)}
  .vidnote{margin:10px 0 0;font-size:12px;color:var(--dim);line-height:1.6}
  .vidsearch{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--acc);
    text-decoration:none;border-bottom:1px dotted var(--acc)}
  @media(max-width:560px){ .logicbox{padding:13px 12px 11px} .logicstage{min-height:190px;padding:13px} }

  /* marks + sure shot */
  .mchip{font:600 10.5px/1 ui-monospace,monospace;background:color-mix(in srgb,var(--acc) 16%,transparent);
    color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:5px;padding:3px 6px}
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-bottom:10px;
    box-shadow:var(--shadow);cursor:pointer}
  .scard:hover{border-color:var(--acc)}

<script>
/* =========================================================
   storage
   ========================================================= */
const KEY = "csit6.srs.v1";
let SRS = { reviews: {}, days: {} };
try { SRS = Object.assign(SRS, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
const saveSRS = () => { try { localStorage.setItem(KEY, JSON.stringify(SRS)); } catch (e) {} };

const DAY = 86400000;
const todayKey = () => new Date().toISOString().slice(0, 10);

/* =========================================================
   views + routing
   ========================================================= */
const view = document.getElementById("view");
let route = { view: "topics", lab: null };

function go(v, lab) {
  route = { view: v, lab: lab || null };
  const want = lab ? "#" + lab : v === "labs" ? "" : "#" + v;
  try { history.replaceState(null, "", location.pathname + location.search + want); } catch (e) {}
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === v && !lab));
  render();
  window.scrollTo(0, 0);
}
document.getElementById("nav").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-view]");
  if (b) go(b.dataset.view);
});
document.getElementById("theme").addEventListener("click", () => {
  const n = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", n);
  try { localStorage.setItem("csit6.theme", n); } catch (e) {}
  /* every colour in this app comes from a CSS variable, so the browser repaints by itself —
     no re-render, which means an open lab, a revealed step or an expanded answer survives the toggle */
});

/* =========================================================
   LAB 1 — regex → NFA → DFA
   ========================================================= */
function regexLab() {
  view.innerHTML = `
  <div class="labhead">
    <button class="back" onclick="go('labs')">← Labs</button>
    <div class="labtitle">Regex → NFA → DFA <small>CDC Unit 2 · the question that appears every year</small></div>
  </div>
  <div class="panel">
    <div class="row">
      <div class="field"><label>Regular expression</label>
        <input type="text" id="re" value="(a|b)*abb" spellcheck="false" /></div>
      <div class="field"><label>Test string</label>
        <input type="text" id="test" value="aabb" spellcheck="false" style="min-width:100px" /></div>
      <button class="act" id="build">Build</button>
    </div>
    <p class="hintline">Operators: <code>|</code> union · <code>*</code> star · <code>+</code> plus · <code>?</code> optional · <code>( )</code> grouping. Concatenation is implicit. Alphabet = whatever letters you type.</p>
    <div id="rerr" class="err"></div>
  </div>
  <div class="panel"><div id="nfaWrap"></div></div>
  <div class="panel"><div id="dfaWrap"></div></div>`;

  const R = document.getElementById("re");
  const build = () => {
    document.getElementById("rerr").textContent = "";
    try {
      const ast = parseRegex(R.value);
      const nfa = thompson(ast);
      const dfa = subset(nfa);
      document.getElementById("nfaWrap").innerHTML =
        `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
           <b style="font-size:13.5px">Step 1 — ε-NFA (Thompson)</b>
           <span style="font-size:12px;color:var(--mut)">${nfa.states.length} states, start = S0</span>
         </div>` + svgGraph(nfa, nfa.start, new Set([nfa.accept])) +
        trial(nfa, document.getElementById("test").value, "NFA");

      const accept = new Set(dfa.states.filter((s) => s.accept).map((s) => s.id));
      document.getElementById("dfaWrap").innerHTML =
        `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
           <b style="font-size:13.5px">Step 2 — DFA (subset construction)</b>
           <span style="font-size:12px;color:var(--mut)">${dfa.states.length} states after merging ε-closures</span>
         </div>` + svgGraph(dfa, dfa.start, accept) +
        dfaTable(dfa) +
        trial(dfa, document.getElementById("test").value, "DFA");
    } catch (e) {
      document.getElementById("rerr").textContent = "Cannot parse: " + e.message;
      document.getElementById("nfaWrap").innerHTML = "";
      document.getElementById("dfaWrap").innerHTML = "";
    }
  };
  document.getElementById("build").addEventListener("click", build);
  R.addEventListener("keydown", (e) => { if (e.key === "Enter") build(); });
  build();
}

/* --- tiny regex front end --- */
function parseRegex(src) {
  const t = [...src.replace(/\s+/g, "")].map((c) => ("|*+?()".includes(c) ? { k: c } : { k: "lit", v: c }));
  let i = 0;
  const alt = () => { let n = cat(); while (t[i] && t[i].k === "|") { i++; n = { k: "alt", a: n, b: cat() }; } return n; };
  const cat = () => {
    let n = rep();
    while (t[i] && t[i].k !== "|" && t[i].k !== ")") n = { k: "cat", a: n, b: rep() };
    return n;
  };
  const rep = () => {
    let n = atom();
    while (t[i] && "*+?".includes(t[i].k)) { const op = t[i++].k; n = { k: op === "*" ? "star" : op === "+" ? "plus" : "opt", a: n }; }
    return n;
  };
  const atom = () => {
    const x = t[i];
    if (!x) throw new Error("expression ends too early");
    if (x.k === "(") { i++; const n = alt(); if (!t[i] || t[i].k !== ")") throw new Error("missing )"); i++; return n; }
    if (x.k === "lit") { i++; return { k: "lit", v: x.v }; }
    throw new Error(`unexpected "${x.k}"`);
  };
  const ast = alt();
  if (i < t.length) throw new Error("trailing input near index " + i);
  return ast;
}

function thompson(ast) {
  const states = [];
  const S = () => { const s = { id: states.length, eps: [], trans: [] }; states.push(s); return s.id; };
  const build = (n) => {
    if (n.k === "lit") { const a = S(), b = S(); states[a].trans.push({ sym: n.v, to: b }); return [a, b]; }
    if (n.k === "cat") { const [a, b] = build(n.a); const [c, d] = build(n.b); states[b].eps.push(c); return [a, d]; }
    if (n.k === "alt") {
      const s = S(), e = S(); const [a, b] = build(n.a); const [c, d] = build(n.b);
      states[s].eps.push(a, c); states[b].eps.push(e); states[d].eps.push(e); return [s, e];
    }
    if (n.k === "star") {
      const s = S(), e = S(); const [a, b] = build(n.a);
      states[s].eps.push(a, e); states[b].eps.push(a, e); return [s, e];
    }
    if (n.k === "plus") {
      const s = S(), e = S(); const [a, b] = build(n.a);
      states[s].eps.push(a); states[b].eps.push(a, e); return [s, e];
    }
    if (n.k === "opt") {
      const s = S(), e = S(); const [a, b] = build(n.a);
      states[s].eps.push(a, e); states[b].eps.push(e); return [s, e];
    }
    throw new Error("bad node");
  };
  const [start, accept] = build(ast);
  return { states, start, accept };
}

function eclose(nfa, ids) {
  const out = new Set(ids); const st = [...ids];
  while (st.length) { const s = st.pop(); for (const n of nfa.states[s].eps) if (!out.has(n)) { out.add(n); st.push(n); } }
  return out;
}

function subset(nfa) {
  const alpha = [...new Set(nfa.states.flatMap((s) => s.trans.map((t) => t.sym)))].sort();
  const startSet = eclose(nfa, [nfa.start]);
  const sets = [startSet], index = new Map([[key(startSet), 0]]);
  const states = [{ id: "D0", set: startSet, accept: startSet.has(nfa.accept), trans: [] }];
  for (let q = 0; q < sets.length; q++) {
    const cur = sets[q];
    for (const a of alpha) {
      const move = new Set();
      for (const s of cur) for (const t of nfa.states[s].trans) if (t.sym === a) move.add(t.to);
      if (!move.size) continue;
      const cl = eclose(nfa, move);
      const k = key(cl);
      if (!index.has(k)) { index.set(k, sets.length); sets.push(cl); states.push({ id: "D" + (sets.length - 1), set: cl, accept: cl.has(nfa.accept), trans: [] }); }
      states[q].trans.push({ sym: a, to: "D" + index.get(k) });
    }
  }
  return { states, start: "D0", alphabet: alpha };
}
const key = (set) => [...set].sort((a, b) => a - b).join(",");

/* --- SVG rendering --- */
let graphSeq = 0;
function svgGraph(g, startId, acceptSet) {
  const uid = "ar" + ++graphSeq;
  const byId = new Map(g.states.map((s) => [s.id, s]));

  // BFS over symbol *and* ε moves: a Thompson NFA is a long chain of ε hops,
  // so following only symbol edges would collapse every state into one column.
  const level = new Map([[startId, 0]]);
  const queue = [startId];
  while (queue.length) {
    const cur = queue.shift();
    const st = byId.get(cur);
    if (!st) continue;
    for (const to of [...st.trans.map((t) => t.to), ...(st.eps || [])]) {
      if (!level.has(to)) { level.set(to, level.get(cur) + 1); queue.push(to); }
    }
  }
  const nodes = g.states.map((s) => s.id);
  let maxL = 0;
  for (const n of nodes) if (level.has(n)) maxL = Math.max(maxL, level.get(n));
  for (const n of nodes) if (!level.has(n)) level.set(n, maxL + 1);
  for (const n of nodes) maxL = Math.max(maxL, level.get(n));

  // merge parallel edges: one path per ordered pair, symbols joined ("a,b" / "ε")
  const edges = new Map();
  const addEdge = (from, to, sym, eps) => {
    const k = from + "→" + to;
    const e = edges.get(k) || { from, to, syms: [], eps };
    if (!e.syms.includes(sym)) e.syms.push(sym);
    e.eps = e.eps && eps;
    edges.set(k, e);
  };
  for (const st of g.states) {
    for (const t of st.trans) addEdge(st.id, t.to, String(t.sym), false);
    for (const to of st.eps || []) addEdge(st.id, to, "ε", true);
  }

  const byL = new Map();
  for (const n of nodes) {
    const l = level.get(n);
    if (!byL.has(l)) byL.set(l, []);
    byL.get(l).push(n);
  }

  const rows = Math.max(...[...byL.values()].map((a) => a.length), 1);
  const cols = maxL + 1;
  const CW = Math.max(64, Math.min(126, Math.round(980 / cols)));
  const CH = 74;
  const padL = 38, padT = 34;

  const pos = new Map();
  for (const [l, arr] of byL) {
    const offset = ((rows - arr.length) * CH) / 2;
    arr.forEach((n, i) => pos.set(n, { x: padL + 26 + l * CW, y: padT + 26 + offset + i * CH }));
  }
  const w = padL + (cols - 1) * CW + 96;
  const h = Math.max(132, padT + rows * CH + 36);

  let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="${uid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs>`;

  for (const e of edges.values()) {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) continue;
    const cls = e.eps ? "edge eps" : "edge";
    let d, lx, ly;
    if (e.from === e.to) {
      d = `M${a.x - 11},${a.y - 17} C${a.x - 30},${a.y - 58} ${a.x + 30},${a.y - 58} ${a.x + 11},${a.y - 17}`;
      lx = a.x; ly = a.y - 50;
    } else {
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const sx = a.x + ux * 19, sy = a.y + uy * 19;
      const ex = b.x - ux * 21, ey = b.y - uy * 21;
      const span = Math.abs(dx) / CW + Math.abs(dy) / CH;
      let bow = span > 1.7 ? -30 : 0;
      if (edges.has(e.to + "→" + e.from)) bow = -46;
      const mx = (sx + ex) / 2 - uy * bow, my = (sy + ey) / 2 + ux * bow;
      d = `M${sx},${sy} Q${mx},${my} ${ex},${ey}`;
      lx = (sx + ex) / 2 - uy * bow * 0.55;
      ly = (sy + ey) / 2 + ux * bow * 0.55 - 5;
    }
    s += `<path class="${cls}" d="${d}" marker-end="url(#${uid})"/>`;
    s += `<text class="elabel" x="${lx}" y="${ly}">${esc(e.syms.join(","))}</text>`;
  }

  // start arrow
  const sp = pos.get(startId);
  if (sp) s += `<path class="edge" d="M${sp.x - 44},${sp.y} L${sp.x - 21},${sp.y}" marker-end="url(#${uid})"/>`;

  for (const [id, p] of pos) {
    const cls = "node" + (id === startId ? " start" : "") + (acceptSet.has(id) ? " accept" : "");
    s += `<g class="${cls}"><circle cx="${p.x}" cy="${p.y}" r="17"/>
      <text x="${p.x}" y="${p.y + 4}">${esc(String(id).replace(/^S|^D/, ""))}</text>
      ${acceptSet.has(id) ? `<circle cx="${p.x}" cy="${p.y}" r="21"/>` : ""}</g>`;
  }
  s += `</svg>`;

  const legend = `<div class="legend"><span>${acceptSet.size ? "<i class=\"dot acc\"></i> accepting" : ""}</span>
    <span>${edges.size && [...edges.values()].some((e) => e.eps) ? "<i class=\"dot eps\"></i> ε (empty) move" : ""}</span>
    <span><i class="dot start"></i> start</span></div>`;
  return `<div class="graph">${s}</div>${legend}`;
}
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function dfaTable(dfa) {
  const rows = dfa.states.map((s) =>
    `<tr><td>${s.id}${s.accept ? " ✓" : ""}</td>${dfa.alphabet.map((a) => {
      const t = s.trans.find((x) => x.sym === a);
      return `<td>${t ? t.to : "—"}</td>`;
    }).join("")}</tr>`).join("");
  return `<table><thead><tr><th>State</th>${dfa.alphabet.map((a) => `<th>${esc(a)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
}

function trial(aut, input, label) {
  let cur = aut.start;
  if (label === "NFA") {
    let set = eclose(aut, [cur.id != null ? cur : aut.start]);
    for (const ch of input) {
      const nx = new Set();
      for (const s of set) for (const t of aut.states[s].trans) if (t.sym === ch) nx.add(t.to);
      set = eclose(aut, nx);
      if (!set.size) break;
    }
    const ok = set.has(aut.accept);
    return verdict(label, input, ok);
  }
  for (const ch of input) {
    const t = aut.states.find((s) => s.id === cur).trans.find((x) => x.sym === ch);
    if (!t) return verdict(label, input, false);
    cur = t.to;
  }
  const st = aut.states.find((s) => s.id === cur);
  return verdict(label, input, !!st.accept);
}
const verdict = (label, input, ok) =>
  `<p class="hintline">${label} on <code>${esc(input || "ε")}</code> → <b style="color:${ok ? "var(--acc)" : "var(--bad)"}">${ok ? "ACCEPTED" : "REJECTED"}</b></p>`;

function genTAC(src, useCSE) {
  const op = src.replace(/\s+/g, "");
  if (!op) throw new Error("empty statement");
  const parts = op.split(/=(.*)/s);
  const lhs = op.includes("=") ? parts[0].trim() : null;
  const rhs = op.includes("=") ? parts[1] : op;
  if (!rhs) throw new Error("nothing on the right of =");
  const toks = rhs.match(/[A-Za-z_]\w*|\d+(?:\.\d+)?|[-+*/()]/g);
  if (!toks) throw new Error("no operands found");

  // shunting-yard, with unary minus handled as "u-"
  const prec = { "+": 1, "-": 1, "*": 2, "/": 2, "u-": 3, "u+": 3 };
  const outq = [], ops = [];
  let prev = null;
  for (const t of toks) {
    if (/^[A-Za-z_]\w*$/.test(t) || /^\d/.test(t)) { outq.push(t); prev = "val"; }
    else if (t === "(") { ops.push(t); prev = "op"; }
    else if (t === ")") {
      while (ops.length && ops[ops.length - 1] !== "(") outq.push(ops.pop());
      if (!ops.length) throw new Error("unbalanced )");
      ops.pop(); prev = "val";
    } else {
      const un = (t === "-" || t === "+") && (prev === null || prev === "op");
      const o = un ? "u" + t : t;
      while (ops.length && ops[ops.length - 1] !== "(" && prec[ops[ops.length - 1]] >= prec[o]) outq.push(ops.pop());
      ops.push(o); prev = "op";
    }
  }
  while (ops.length) { const o = ops.pop(); if (o === "(") throw new Error("unbalanced ("); outq.push(o); }

  let n = 0;
  const lines = [], quad = [], tri = [];
  const cseMap = new Map();
  const isTemp = (x) => /^t\d+$/.test(x);
  const tempName = (i) => "t" + i;
  const triIndex = new Map();

  const emit = (o, a1, a2) => {
    const k = o + "|" + a1 + "|" + (a2 || "");
    if (useCSE && cseMap.has(k)) return cseMap.get(k);
    const t = tempName(++n);
    const body = a2 === "" ? (o[0] === "u" ? o[1] + a1 : a1) : `${a1} ${o} ${a2}`;
    lines.push(`${t} = ${body}`);
    const opname = o === "u-" ? "uminus" : o;
    quad.push([opname, a1, a2 === "" ? "-" : a2, t]);
    const ti = tri.length;
    tri.push([opname, a1, a2 === "" ? "-" : a2]);
    if (isTemp(a1)) { const j = triIndex.get(a1); tri[ti][1] = `(${j})`; }
    if (isTemp(a2)) { const j = triIndex.get(a2); tri[ti][2] = `(${j})`; }
    triIndex.set(t, ti);
    if (useCSE) cseMap.set(k, t);
    return t;
  };

  const stack = [];
  for (const t of outq) {
    if (/^[A-Za-z_]\w*$/.test(t) || /^\d/.test(t)) { stack.push(t); continue; }
    if (t === "u-" || t === "u+") { const a = stack.pop(); if (a === undefined) throw new Error("bad expression"); stack.push(t === "u-" ? emit("u-", a, "") : a); continue; }
    const b = stack.pop(), a = stack.pop();
    if (a === undefined || b === undefined) throw new Error("bad expression");
    stack.push(emit(t, a, b));
  }
  if (stack.length !== 1) throw new Error("bad expression");
  const result = stack[0];
  if (lhs) lines.push(`${lhs} = ${result}`);
  else lines.push(`result = ${result}`);
  return { lines, quad, tri };
}

/* =========================================================
   LAB 3 — COCOMO
   ========================================================= */
function cocomoLab() {
  const MODES = {
    organic: { a: 2.4, b: 1.05, c: 2.5, d: 0.38 },
    semi: { a: 3.0, b: 1.12, c: 2.5, d: 0.35 },
    embedded: { a: 3.6, b: 1.20, c: 2.5, d: 0.32 },
  };
  view.innerHTML = `
  <div class="labhead">
    <button class="back" onclick="go('labs')">← Labs</button>
    <div class="labtitle">COCOMO calculator <small>SE Unit 10 · basic and intermediate model</small></div>
  </div>
  <div class="panel">
    <div class="row">
      <div class="field"><label>Size (KLOC)</label><input type="number" id="kloc" value="33.6" step="0.1" min="0.1" /></div>
      <div class="field"><label>Mode</label>
        <select id="mode"><option value="organic">Organic</option><option value="semi" selected>Semi-detached</option><option value="embedded">Embedded</option></select></div>
      <div class="field"><label>Cost driver (EAF)</label><input type="number" id="eaf" value="1" step="0.01" min="0.1" /></div>
      <div class="field"><label>Rate / person-month</label><input type="number" id="rate" value="0" step="1000" /></div>
    </div>
    <p class="hintline">Set EAF to 1 for basic COCOMO. Effort = a × KLOC^b × EAF · Time = c × Effort^d · Staff = Effort / Time.</p>
  </div>
  <div class="panel" id="cocOut"></div>`;

  const calc = () => {
    const K = parseFloat(document.getElementById("kloc").value) || 0;
    const m = MODES[document.getElementById("mode").value];
    const eaf = parseFloat(document.getElementById("eaf").value) || 1;
    const rate = parseFloat(document.getElementById("rate").value) || 0;
    const effort = m.a * Math.pow(K, m.b) * eaf;
    const time = m.c * Math.pow(effort, m.d);
    const staff = effort / time;
    const prod = K / effort;
    const cost = effort * rate;
    const f = (x, d = 2) => Number(x).toFixed(d);

    document.getElementById("cocOut").innerHTML = `
      <div class="statgrid">
        <div class="stat"><span>Effort</span><b>${f(effort)}</b>person-months</div>
        <div class="stat"><span>Development time</span><b>${f(time)}</b>months</div>
        <div class="stat"><span>Average staff</span><b>${f(staff)}</b>persons</div>
        <div class="stat"><span>Productivity</span><b>${f(prod, 3)}</b>KLOC / PM</div>
        ${rate ? `<div class="stat"><span>Cost</span><b>${Math.round(cost).toLocaleString()}</b>currency</div>` : ""}
      </div>
      <div style="margin-top:18px">
        <b style="font-size:13px">The substitution (write this line in the exam — it earns method marks)</b>
        <pre style="margin-top:8px">E = ${m.a} × (${K})^${m.b} × ${eaf} = ${f(effort)} PM
D = ${m.c} × (${f(effort)})^${m.d} = ${f(time)} months
P = E / D = ${f(effort)} / ${f(time)} = ${f(staff)} persons</pre>
      </div>`;
  };
  ["kloc", "mode", "eaf", "rate"].forEach((id) => document.getElementById(id).addEventListener("input", calc));
  calc();
}

/* =========================================================
   LAB 4 — ASP.NET Core request pipeline
   ========================================================= */
function pipelineLab() {
  const MW = [
    { n: "Kestrel", d: "accepts TCP connection, parses the HTTP request" },
    { n: "ExceptionHandler", d: "try/catch around everything downstream" },
    { n: "HSTS", d: "adds Strict-Transport-Security on responses" },
    { n: "HttpsRedirection", d: "issues a 307 if the request is plain HTTP" },
    { n: "StaticFiles", d: "serves wwwroot if the path is a real file" },
    { n: "Routing", d: "matches the URL to an endpoint, sets metadata" },
    { n: "Authentication", d: "reads the cookie/JWT and sets HttpContext.User" },
    { n: "Authorization", d: "evaluates [Authorize], roles, policies" },
    { n: "Endpoint", d: "runs the controller action / minimal API handler" },
    { n: "Response", d: "serialises the result and writes it back out" },
  ];
  const SCEN = {
    static: { label: "GET /css/site.css", stop: 4, code: "200 · file streamed", why: "StaticFiles finds the file and short-circuits — Routing and auth never run." },
    page: { label: "GET /Students/Index", stop: null, code: "200 · HTML", why: "Nothing short-circuits: every middleware calls next(), the action runs, and the response unwinds back out through the same stack." },
    denied: { label: "GET /Admin/Users (not logged in)", stop: 7, code: "302 → /Account/Login", why: "Authorization fails and challenges the request. The action never executes." },
    missing: { label: "GET /nope", stop: 5, code: "404", why: "Routing matches no endpoint, so nothing downstream handles it and the pipeline returns 404." },
    http: { label: "GET http://site/ (plain HTTP)", stop: 3, code: "307 → https://site/", why: "HttpsRedirection stops the pipeline before anything else touches it." },
  };

  view.innerHTML = `
  <div class="labhead">
    <button class="back" onclick="go('labs')">← Labs</button>
    <div class="labtitle">ASP.NET Core request pipeline <small>NCC Unit 3–4 · middleware order decides behaviour</small></div>
  </div>
  <div class="panel">
    <div class="row" id="scen"></div>
    <div class="log" id="log">Pick a request, then press Run.</div>
  </div>
  <div class="panel"><div class="pipe" id="pipe"></div></div>`;

  document.getElementById("scen").innerHTML =
    Object.entries(SCEN).map(([k, v]) => `<button class="ghost" data-scen="${k}">${v.label}</button>`).join("") +
    `<button class="act" id="run">Run ▶</button>`;

  let current = "page", timers = [];

  const draw = (states) => {
    document.getElementById("pipe").innerHTML = MW.map((m, i) => {
      const st = states[i] || "";
      return `<div class="stage ${st}"><span class="no">${i + 1}</span>
        <span class="name">${m.n}</span><span class="desc">${m.d}</span></div>`;
    }).join("");
  };

  const reset = () => { timers.forEach(clearTimeout); timers = []; draw({}); document.getElementById("log").textContent = "Pick a request, then press Run."; };
  const run = () => {
    reset();
    const s = SCEN[current];
    const logEl = document.getElementById("log");
    logEl.textContent = "";
    const states = {};
    draw({});
    const last = s.stop === null ? MW.length - 1 : s.stop;
    for (let i = 0; i <= last; i++) {
      timers.push(setTimeout(() => {
        for (let j = 0; j < i; j++) states[j] = "pass";
        states[i] = "now";
        draw(Object.assign({}, states));
        logEl.textContent += `→ ${MW[i].n}: ok\n`;
        logEl.scrollTop = logEl.scrollHeight;
        if (i === last) {
          timers.push(setTimeout(() => {
            if (s.stop === null) {
              states[i] = "pass";
              draw(Object.assign({}, states));
              logEl.textContent += `\n✔ completed — unwinds back up the stack\n${s.code}\n\n${s.why}`;
            } else {
              states[i] = "stop";
              for (let j = i + 1; j < MW.length; j++) states[j] = "skip";
              draw(Object.assign({}, states));
              logEl.textContent += `\n■ short-circuited here\n${s.code}\n\n${s.why}`;
            }
            logEl.scrollTop = logEl.scrollHeight;
          }, 340));
        }
      }, i * 380));
    }
  };

  document.getElementById("scen").addEventListener("click", (e) => {
    const b = e.target.closest("[data-scen]");
    if (!b) return;
    current = b.dataset.scen;
    reset();
    document.querySelectorAll("[data-scen]").forEach((x) => x.style.borderColor = "");
    b.style.borderColor = "var(--acc)";
  });
  document.getElementById("run").addEventListener("click", run);
  reset();
  document.querySelector('[data-scen="page"]').style.borderColor = "var(--acc)";
}

let bankQ = { text: "", filter: "all" };

function bankRows() {
  const pool = window.QBANK.filter((q) => q.s === drill.subj);
  const t = bankQ.text.trim().toLowerCase();
  return pool.filter((q) => {
    if (t && !q.q.toLowerCase().includes(t)) return false;

    if (bankQ.filter === "five") return (q.marks || 5) < 10;
    if (bankQ.filter === "repeat") return REPEAT_IDS.has(q.id);

  });

function startDrill(mode) {
  const pool = window.QBANK.filter((q) => q.s === drill.subj);
  let list = pool.slice();
  if (mode === "due") list = list.filter(isDue);
  if (mode === "new") list = list.filter((q) => !SRS.reviews[q.id]);
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  drill.queue = list.slice(0, drill.size);
  drill.i = 0; drill.done = 0;
  if (!drill.queue.length) {
    document.getElementById("drillArea").innerHTML = `<div class="empty">Nothing due for ${SUBJ[drill.subj]} — try “Mixed 10” or come back tomorrow.</div>`;
    return;
  }
  showQuestion();
}
